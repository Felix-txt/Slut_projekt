        <h1>File Upload</h1>

        <div class="user">
            <a href="" id="userIcon">
                <svg xmlns="http://www.w3.org/2000/svg" width="56" height="56" fill="currentColor" class="bi bi-person-circle" viewBox="0 0 16 16">
                    <path d="M11 6a3 3 0 1 1-6 0 3 3 0 0 1 6 0"/>

            </a>
            <span id="accountName" class="account-name"></span>

        </div>
    </div>

    <!-- Sektion fÃ¶r uppladdningsformulÃ¤r -->
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h3>Upload File</h3>
                    </div>
                    <div class="card-body">
                        <!-- FormulÃ¤r fÃr filuppladdning -->
                        <form id="uploadForm" enctype="multipart/form-data">
                            <div class="mb-3">
                                <label for="fileInput" class="form-label">VÃ¤lj Fil</label>
                                <input type="file" class="form-control" id="fileInput" name="file" required>
                            </div>
                            <div class="mb-3">
                                <label for="patchNotes" class="form-label">Patch Notes</label>
                                <textarea class="form-control" id="patchNotes" name="patchNotes" rows="4" placeholder="Skriv patch notes hÃ¤r..."></textarea>
                            </div>
                            <div class="mb-3">
                                <label for="version" class="form-label">Version</label>
                                <input type="text" class="form-control" id="version" name="version" placeholder="Ange version, t.ex. 1.0.0" required>
                            </div>
                            <button type="button" class="btn btn-success" id="publishBtn">Publicera</button>
                        </form>
                        <!-- OmrÃ¥de fÃ¶r statusmeddelanden -->
                        <div id="statusMessage" class="mt-3 status-message"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="../js/index.js?v=11"></script>
