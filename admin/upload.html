<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload</title>
    <link rel="stylesheet" href="syle.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
    <div class="top">
            <div class="burger" id="burger">
                <svg xmlns="http://www.w3.org/2000/svg" width="50" height="50" fill="currentColor" class="bi bi-list" viewBox="0 0 15 15">

                </svg>
            </div>
            <nav class="menu" id="menu">
                <a href="../frontend/index.html">Home</a>
                <a href="../frontend/account.html">Account</a>
                <a href="panel.html">Admin panel</a>
                <a href="users.html">Manage users</a>
                <a href="../frontend/game/gameinf.html">Game info</a>
            </nav>
        
        <h1>File Upload</h1>

        <div class="user">
            <a href="" id="userIcon">
                <svg xmlns="http://www.w3.org/2000/svg" width="56" height="56" fill="currentColor" class="bi bi-person-circle" viewBox="0 0 16 16">
                    <path d="M11 6a3 3 0 1 1-6 0 3 3 0 0 1 6 0"/>
                    <path fill-rule="evenodd" d="M0 8a8 8 0 1 1 16 0A8 8 0 0 1 0 8m8-7a7 7 0 0 0-5.468 11.37C3.242 11.226 4.805 10 8 10s4.757 1.225 5.468 2.37A7 7 0 0 0 8 1"/>
                </svg>
            </a>
            <span id="accountName" class="account-name"></span>
            <button class="logout-btn" onclick="logout()">Logout</button>
        </div>
    </div>

    <!-- Sektion för uppladdningsformulär -->
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h3>Upload File</h3>
                    </div>
                    <div class="card-body">
                        <!-- Formulär för filuppladdning -->
                        <form id="uploadForm" enctype="multipart/form-data">
                            <div class="mb-3">
                                <label for="fileInput" class="form-label">Välj Fil</label>
                                <input type="file" class="form-control" id="fileInput" name="file" required>
                            </div>
                            <div class="mb-3">
                                <label for="patchNotes" class="form-label">Patch Notes</label>
                                <textarea class="form-control" id="patchNotes" name="patchNotes" rows="4" placeholder="Skriv patch notes här..."></textarea>
                            </div>
                            <div class="mb-3">
                                <label for="version" class="form-label">Version</label>
                                <input type="text" class="form-control" id="version" name="version" placeholder="Ange version, t.ex. 1.0.0" required>
                            </div>
                            <button type="button" class="btn btn-success" id="publishBtn">Publicera</button>
                        </form>
                        <!-- Område för statusmeddelanden -->
                        <div id="statusMessage" class="mt-3" style="display: none;"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="index.js?v=9"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

    <!-- Anpassad JavaScript för hantering av filuppladdning -->
    <script>
        // Funktion för att få API-kandidater (återanvänd från index.js)
        function getApiCandidates() {
            const host = window.location.hostname || "localhost";
            const protocol = window.location.protocol === "file:" ? "http:" : window.location.protocol;
            const candidates = [];

            if (window.location.protocol !== "file:" && window.location.port === "8090") {
                candidates.push(`${window.location.origin}/api`);
            }

            if (window.location.protocol !== "file:" && (window.location.port === "5000" || window.location.port === "5001")) {
                candidates.push(`${window.location.origin}/api`);
            }

            candidates.push(`${protocol}//${host}:5001/api`);
            candidates.push(`${protocol}//${host}:5000/api`);

            return [...new Set(candidates)];
        }

        // Funktion för att göra API-förfrågningar (återanvänd från index.js)
        async function apiFetch(path, options = {}) {
            let lastError = null;

            for (const baseUrl of getApiCandidates()) {
                try {
                    const res = await fetch(`${baseUrl}${path}`, options);
                    const text = await res.text();
                    return text ? JSON.parse(text) : {};
                } catch (error) {
                    lastError = error;
                }
            }

            throw lastError || new Error("Kunde inte ansluta till servern");
        }

        // Funktion för att visa statusmeddelanden
        function showStatusMessage(message, type = 'info') {
            const statusDiv = document.getElementById('statusMessage');
            statusDiv.className = `alert alert-${type}`;
            statusDiv.textContent = message;
            statusDiv.style.display = 'block';
            setTimeout(() => {
                statusDiv.style.display = 'none';
            }, 5000); // Dölj efter 5 sekunder
        }

        // Variabel för att lagra den uppladdade filens URL
        let uploadedFileUrl = null;

        // Händelselyssnare för formulärskickning - borttagen eftersom vi bara har publiceringsknapp
        // document.getElementById('uploadForm').addEventListener('submit', async function(event) {
        //     ...
        // });

        // Händelselyssnare för publish-knappen
        document.getElementById('publishBtn').addEventListener('click', async function() {
            const fileInput = document.getElementById('fileInput');
            const file = fileInput.files[0];
            const patchNotes = document.getElementById('patchNotes').value;
            const version = document.getElementById('version').value;

            if (!file) {
                showStatusMessage('Välj en fil att ladda upp.', 'warning');
                return;
            }

            const title = prompt('Ange titel för spelet:');
            const description = prompt('Ange beskrivning för spelet:');

            if (!title || !description || !version) {
                showStatusMessage('Alla fält måste fyllas i för att publicera.', 'warning');
                return;
            }

            // Hämta autentiseringstoken
            const token = localStorage.getItem('token');
            if (!token) {
                showStatusMessage('Du måste vara inloggad för att ladda upp filer.', 'danger');
                return;
            }

            try {
                showStatusMessage('Laddar upp fil och publicerar spel...', 'info');

                // Först ladda upp filen
                const formData = new FormData();
                formData.append('file', file);
                if (patchNotes) {
                    formData.append('patchNotes', patchNotes);
                }
                formData.append('publish', 'true');

                const uploadResponse = await apiFetch('/admin/upload', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`
                    },
                    body: formData
                });

                if (!uploadResponse.ok) {
                    showStatusMessage(`Uppladdning misslyckades: ${uploadResponse.errorMessage || 'Okänt fel'}`, 'danger');
                    return;
                }

                const downloadUrl = uploadResponse.downloadUrl;
                if (!downloadUrl) {
                    showStatusMessage('Uppladdning lyckades men ingen nedladdnings-URL mottogs.', 'warning');
                    return;
                }

                // Sedan skapa spelet
                const gameResponse = await apiFetch('/games/create', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({
                        title: title,
                        description: description,
                        download_url: downloadUrl,
                        version: version
                    })
                });

                if (gameResponse.ok) {
                    showStatusMessage('Fil uppladdad och spel publicerat framgångsrikt!', 'success');
                    fileInput.value = '';
                    document.getElementById('patchNotes').value = '';
                    document.getElementById('version').value = '';
                } else {
                    showStatusMessage(`Publicering misslyckades: ${gameResponse.message || 'Okänt fel'}`, 'danger');
                }
            } catch (error) {
                console.error('Fel:', error);
                showStatusMessage('Misslyckades: Kunde inte ansluta till servern.', 'danger');
            }
        });

        // Funktion för att hantera utloggning (antar att den är definierad i index.js)
        function logout() {
            // Denna funktion bör vara definierad i index.js
            if (typeof window.logout === 'function') {
                window.logout();
            } else {
                localStorage.removeItem('token');
                localStorage.removeItem('username');
                localStorage.removeItem('email');
                localStorage.removeItem('accountId');
                window.location.href = '../frontend/login-signin.html#login';
            }
        }
    </script>
</body>
</html>
