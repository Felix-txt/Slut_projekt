<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload</title>
    <link rel="stylesheet" href="syle.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
    <div class="top">
            <div class="burger" id="burger">
                <svg xmlns="http://www.w3.org/2000/svg" width="50" height="50" fill="currentColor" class="bi bi-list" viewBox="0 0 15 15">
                    <path fill-rule="evenodd" d="M2.5 12a.5.5 0 0 1 .5-.5h10a.5.5 0 0 1 0 1H3a.5.5 0 0 1-.5-.5m0-4a.5.5 0 0 1 .5-.5h10a.5.5 0 0 1 0 1H3a.5.5 0 0 1-.5-.5m0-4a.5.5 0 0 1 .5-.5h10a.5.5 0 0 1 0 1H3a.5.5 0 0 1-.5-.5"/>
                </svg>
            </div>
            <nav class="menu" id="menu">
                <a href="../frontend/index.html">Home</a>
                <a href="../frontend/account.html">Account</a>
                <a href="panel.html">Admin panel</a>
                <a href="users.html">Manage users</a>
                <a href="../frontend/game/gameinf.html">Game info</a>
            </nav>
        
        <h1>File Upload</h1>

        <div class="user">
            <a href="" id="userIcon">
                <svg xmlns="http://www.w3.org/2000/svg" width="56" height="56" fill="currentColor" class="bi bi-person-circle" viewBox="0 0 16 16">
                    <path d="M11 6a3 3 0 1 1-6 0 3 3 0 0 1 6 0"/>
                    <path fill-rule="evenodd" d="M0 8a8 8 0 1 1 16 0A8 8 0 0 1 0 8m8-7a7 7 0 0 0-5.468 11.37C3.242 11.226 4.805 10 8 10s4.757 1.225 5.468 2.37A7 7 0 0 0 8 1"/>
                </svg>
            </a>
            <span id="accountName" class="account-name"></span>
            <button class="logout-btn" onclick="logout()">Logout</button>
        </div>
    </div>

    <!-- Sektion för uppladdningsformulär -->
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h3>Upload File</h3>
                    </div>
                    <div class="card-body">
                        <!-- Formulär för filuppladdning -->
                        <form id="uploadForm" enctype="multipart/form-data">
                            <div class="mb-3">
                                <label for="fileInput" class="form-label">Select File</label>
                                <input type="file" class="form-control" id="fileInput" name="file" required>
                                <div class="form-text">Choose a file to upload to the server.</div>
                            </div>
                            <button type="submit" class="btn btn-primary">Upload</button>
                        </form>
                        <!-- Område för statusmeddelanden -->
                        <div id="statusMessage" class="mt-3" style="display: none;"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="index.js?v=9"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

    <!-- Anpassad JavaScript för hantering av filuppladdning -->
    <script>
        // Funktion för att få API-kandidater (återanvänd från index.js)
        function getApiCandidates() {
            const host = window.location.hostname || "localhost";
            const protocol = window.location.protocol === "file:" ? "http:" : window.location.protocol;
            const candidates = [];

            if (window.location.protocol !== "file:" && window.location.port === "8090") {
                candidates.push(`${window.location.origin}/api`);
            }

            if (window.location.protocol !== "file:" && (window.location.port === "5000" || window.location.port === "5001")) {
                candidates.push(`${window.location.origin}/api`);
            }

            candidates.push(`${protocol}//${host}:5001/api`);
            candidates.push(`${protocol}//${host}:5000/api`);

            return [...new Set(candidates)];
        }

        // Funktion för att göra API-förfrågningar (återanvänd från index.js)
        async function apiFetch(path, options = {}) {
            let lastError = null;

            for (const baseUrl of getApiCandidates()) {
                try {
                    const res = await fetch(`${baseUrl}${path}`, options);
                    const text = await res.text();
                    return text ? JSON.parse(text) : {};
                } catch (error) {
                    lastError = error;
                }
            }

            throw lastError || new Error("Could not connect to server");
        }

        // Funktion för att visa statusmeddelanden
        function showStatusMessage(message, type = 'info') {
            const statusDiv = document.getElementById('statusMessage');
            statusDiv.className = `alert alert-${type}`;
            statusDiv.textContent = message;
            statusDiv.style.display = 'block';
            setTimeout(() => {
                statusDiv.style.display = 'none';
            }, 5000); // Hide after 5 seconds
        }

        // Händelselyssnare för formulärskickning
        document.getElementById('uploadForm').addEventListener('submit', async function(event) {
            event.preventDefault(); // Prevent default form submission

            const fileInput = document.getElementById('fileInput');
            const file = fileInput.files[0];

            if (!file) {
                showStatusMessage('Please select a file to upload.', 'warning');
                return;
            }

            // Create FormData object to send the file
            const formData = new FormData();
            formData.append('file', file);

            // Hämta autentiseringstoken
            const token = localStorage.getItem('token');
            if (!token) {
                showStatusMessage('You must be logged in to upload files.', 'danger');
                return;
            }

            try {
                // Visa laddningsmeddelande
                showStatusMessage('Uploading file...', 'info');

                // Gör API-förfrågan till uppladdningsendpoint
                // Antar att backend har en endpoint som /api/admin/upload
                const response = await apiFetch('/admin/upload', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}` // Include auth token
                    },
                    body: formData // Send the file data
                });

                if (response.ok) {
                    // Framgång: visa framgångsmeddelande och fil-URL om tillhandahållen
                    const message = response.downloadUrl ? `File uploaded successfully! Download URL: ${response.downloadUrl}` : 'File uploaded successfully!';
                    showStatusMessage(message, 'success');
                    fileInput.value = ''; // Clear the file input
                } else {
                    // Fel: visa felmeddelande
                    showStatusMessage(`Upload failed: ${response.errorMessage || 'Unknown error'}`, 'danger');
                }
            } catch (error) {
                console.error('Upload error:', error);
                showStatusMessage('Upload failed: Could not connect to server.', 'danger');
            }
        });

        // Funktion för att hantera utloggning (antar att den är definierad i index.js)
        function logout() {
            // This function should be defined in index.js
            if (typeof window.logout === 'function') {
                window.logout();
            } else {
                localStorage.removeItem('token');
                localStorage.removeItem('username');
                localStorage.removeItem('email');
                localStorage.removeItem('accountId');
                window.location.href = '../frontend/login-signin.html#login';
            }
        }
    </script>
</body>
</html>
