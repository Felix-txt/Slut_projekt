services:
  postgres:
    image: postgres:15-alpine
    container_name: csgo-clicker-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-gameuser}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-your_secure_password}
      POSTGRES_DB: ${DB_NAME:-game_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./server/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-gameuser} -d ${DB_NAME:-game_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: ./server
    env_file: ./server/.env
    container_name: csgo-clicker-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres

  nginx:
    image: nginx:alpine
    container_name: csgo-clicker-nginx
    restart: unless-stopped
    ports:
      - "90:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend:/usr/share/nginx/html/frontend:ro
      - ./admin:/usr/share/nginx/html/admin:ro
    depends_on:
      - api

volumes:
  postgres_data:
