<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CS Clicker - Account</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    background: linear-gradient(135deg, #ececec, #d9d9d9);
}

.header {
    display: flex;
    align-items: center;
    padding: 15px;
    position: relative;
}

.burger {
    cursor: pointer;
}

.burger svg,
.title,
button,
.slot,
.avatar {
    transition: 0.3s;
}

.burger:hover svg,
button:hover,
.avatar:hover {
    transform: scale(1.05);
    filter: drop-shadow(0 0 6px #4a6cff);
}

.title {
    margin: auto;
    background: #ddd;
    padding: 10px 30px;
    border-radius: 20px;
    font-size: 32px;
}

.title:hover {
    box-shadow: 0 0 8px #4a6cff;
}

.menu {
    display: none;
    flex-direction: column;
    position: absolute;
    top: 60px;
    left: 10px;
    background: #eee;
    padding: 15px;
    border-radius: 12px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    z-index: 10;
}

.menu.show {
    display: flex;
}

.menu a {
    padding: 10px;
    color: #333;
    text-decoration: none;
    border-radius: 8px;
}

.menu a:hover {
    background: #4a6cff;
    color: white;
}

.auth {
    display: flex;
    gap: 10px;
}

.auth button,
.change-btn,
.toggle-btn,
.modal button {
    border: none;
    color: white;
    cursor: pointer;
}

.signup-btn {
    background: #2f4bb2;
    padding: 8px 16px;
    border-radius: 20px;
}

.login-btn {
    background: #5a6c8f;
    padding: 8px 16px;
    border-radius: 20px;
}

.account-chip {
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 4px;
}

.user-icon {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: #5a6c8f;
    cursor: pointer;
    overflow: hidden;
}

.user-icon img,
.avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.account-name {
    max-width: 120px;
    font-size: 13px;
    font-weight: bold;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
}

.account-page {
    padding: 30px;
}

.profile-box {
    background: #d9d9d9;
    min-height: 205px;
    display: flex;
    gap: 80px;
    padding: 0;
}

.avatar {
    width: 138px;
    height: 138px;
    border-radius: 50%;
    background: #a6a2a2;
    cursor: pointer;
    overflow: hidden;
    position: relative;
}

.avatar img {
    display: none;
}

.avatar.has-pic img {
    display: block;
}

.avatar.has-pic::before,
.avatar.has-pic::after {
    display: none;
}

.avatar::before {
    content: "";
    position: absolute;
    top: 34px;
    left: 48px;
    width: 35px;
    height: 35px;
    border: 6px solid #000;
    border-radius: 50%;
}

.avatar::after {
    content: "";
    position: absolute;
    top: 76px;
    left: 37px;
    width: 55px;
    height: 42px;
    border: 6px solid #000;
    border-bottom: none;
    border-radius: 50px 50px 0 0;
}

.profile-info {
    margin-top: 11px;
}

.row {
    display: flex;
    align-items: center;
    gap: 30px;
    margin-bottom: 67px;
}

.pill {
    width: 288px;
    height: 40px;
    background: #4a4747;
    color: white;
    border-radius: 28px;
    text-align: center;
    line-height: 40px;
    font-size: 30px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.change-btn {
    width: 126px;
    height: 40px;
    background: #4a4747;
    border-radius: 22px;
    font-size: 20px;
}

.account-page.view-only .change-btn,
.account-page.view-only .toggle-btn {
    display: none;
}

.account-page.view-only .avatar {
    cursor: default;
    pointer-events: none;
}

.main-area {
    display: flex;
    gap: 74px;
    margin-top: 10px;
}

.warning {
    width: 334px;
    height: 38px;
    background: #ff8585;
    line-height: 38px;
    text-align: center;
    font-size: 21px;
    cursor: pointer;
}

.card {
    width: 334px;
    height: 537px;
    background: #d9d9d9;
    margin-top: 9px;
    padding-top: 28px;
}

.card h1 {
    text-align: center;
    font-size: 32px;
    font-weight: normal;
    margin-bottom: 29px;
}

.info-box {
    width: 298px;
    height: 441px;
    margin: auto;
    background: #929292;
    padding-top: 24px;
}

.info-row {
    width: 219px;
    height: 41px;
    background: #d9d9d9;
    margin: 0 auto 27px;
    padding: 0 12px;
    line-height: 41px;
    font-size: 18px;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
}

.inventory-area {
    flex: 1;
    padding-top: 22px;
}   

.toggle-btn {
    width: 150px;
    height: 64px;
    background: #868686;
    border-radius: 22px;
    font-size: 21px;
}

.inventory {
    display: none;
    width: 100%;
    height: 400px;
    margin-top: 16px;
    background: #d9d9d9;
    border: 12px solid #929292;
    padding: 18px;
    overflow-y: auto;
}

.inventory.show {
    display: block;
}

.inventory h2 {
    text-align: center;
    font-weight: normal;
    margin-bottom: 15px;
}

.filters {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin-bottom: 15px;
}

.filter-btn {
    background: #868686;
    color: white;
    border: none;
    padding: 8px 16px;
    border-radius: 15px;
    cursor: pointer;
    font-size: 16px;
}

.filter-btn:hover,
.filter-btn.active {
    background: #4a6cff;
}

.inventory-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(70px, 1fr));
    gap: 10px;
}

.slot {
    height: 55px;
    background: #eee;
    border: 3px solid #929292;
    display: grid;
    place-items: center;
    cursor: pointer;
}

.slot:hover,
.slot.selected {
    background: #4a6cff;
    color: white;
}

.slot.empty {
    grid-column: 1 / -1;
    cursor: default;
    color: #555;
}

.slot.empty:hover {
    background: #eee;
    color: #555;
    transform: none;
    filter: none;
}

.modal-bg {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.25);
    justify-content: center;
    align-items: center;
}

.modal-bg.show {
    display: flex;
}

.modal {
    width: 360px;
    background: #d9d9d9;
    border: 8px solid #929292;
    padding: 22px;
}

.modal h2 {
    margin-bottom: 15px;
    font-weight: normal;
}

.modal input {
    width: 100%;
    height: 40px;
    margin-bottom: 15px;
    padding: 5px 10px;
    font-size: 18px;
}

.modal-actions {
    display: flex;
    justify-content: flex-end;
    gap: 10px;
}

.modal button {
    background: #4a4747;
    padding: 9px 15px;
    border-radius: 15px;
}

@media (max-width: 800px) {
    .profile-box,
    .main-area {
        flex-direction: column;
        gap: 20px;
    }

    .row {
        gap: 12px;
        margin-bottom: 20px;
    }

    .pill {
        width: 210px;
        font-size: 22px;
    }
}
</style>
</head>

<body>

<div class="header">
    <div class="burger" id="burger">
        <svg xmlns="http://www.w3.org/2000/svg" width="50" height="50" fill="currentColor" viewBox="0 0 15 15">
            <path fill-rule="evenodd" d="M2.5 12a.5.5 0 0 1 .5-.5h10a.5.5 0 0 1 0 1H3a.5.5 0 0 1-.5-.5m0-4a.5.5 0 0 1 .5-.5h10a.5.5 0 0 1 0 1H3a.5.5 0 0 1-.5-.5m0-4a.5.5 0 0 1 .5-.5h10a.5.5 0 0 1 0 1H3a.5.5 0 0 1-.5-.5"/>
        </svg>
    </div>

    <div class="title">CS-Clicker Account</div>

    <nav class="menu" id="menu">
        <a href="index.html">Home</a>
        <a href="game/patch-download.html">Patch & Download</a>
        <a href="game/gameinf.html">Game info</a>
        <a href="leaderboard.html">Leaderboard</a>
        <a href="account.html" id="accountMenuLink">Account</a>
    </nav>

    <div class="auth" id="authButtons">
        <button class="signup-btn" onclick="goSignup()">SIGN UP</button>
        <button class="login-btn" onclick="goLogin()">LOGIN</button>
    </div>

    <div class="account-chip" id="accountChip">
        <div class="user-icon" onclick="goAccount()">
            <img id="smallPic" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23fff'%3E%3Cpath d='M12 12c2.7 0 5-2.3 5-5s-2.3-5-5-5-5 2.3-5 5 2.3 5 5 5zm0 2c-3.3 0-10 1.7-10 5v2h20v-2c0-3.3-6.7-5-10-5z'/%3E%3C/svg%3E">
        </div>
        <div class="account-name" id="accountName"></div>
    </div>
</div>

<div class="account-page" id="accountPage">
    <section class="profile-box">
        <label class="avatar" id="avatar" for="picUpload">
            <img id="bigPic">
            <input type="file" id="picUpload" accept="image/*" style="display:none" onchange="changePic(event)">
        </label>

        <div class="profile-info">
            <div class="row">
                <div class="pill" id="usernameText">USER NAME</div>
                <button class="change-btn" onclick="openEdit('username')">Change</button>
            </div>

            <div class="row">
                <div class="pill" id="emailText">MAIL</div>
                <button class="change-btn" onclick="openEdit('email')">Change</button>
            </div>
        </div>
    </section>

    <div class="main-area">
        <div>
            <div class="warning" id="warning" onclick="syncGame()">Account not synced with game</div>

            <section class="card">
                <h1>Account info</h1>
                <div class="info-box">
                    <div class="info-row" id="infoName"></div>
                    <div class="info-row" id="infoId"></div>
                    <div class="info-row" id="infoMail"></div>
                    <div class="info-row" id="infoLevel">Level: 0</div>
                    <div class="info-row" id="infoCoins">Coins: 0</div>
                    <div class="info-row" id="infoSync">Not synced</div>
                </div>
            </section>
        </div>

        <div class="inventory-area">
            <button class="toggle-btn" onclick="toggleInventory()">TOGGLE<br>INVENTORY</button>

            <section class="inventory" id="inventory">
                <h2>Inventory</h2>
                <div class="filters">
                    <button class="filter-btn active" data-filter="all">All</button>
                    <button class="filter-btn" data-filter="skin">Skins</button>
                    <button class="filter-btn" data-filter="crate">Crates</button>
                    <button class="filter-btn" data-filter="weapon">Weapons</button>
                </div>
                <div class="inventory-grid" id="inventoryGrid">
                    <div class="slot" data-type="skin">1</div>
                    <div class="slot" data-type="crate">2</div>
                    <div class="slot" data-type="weapon">3</div>
                    <div class="slot" data-type="skin">4</div>
                    <div class="slot" data-type="crate">5</div>
                    <div class="slot" data-type="weapon">6</div>
                    <div class="slot" data-type="skin">7</div>
                    <div class="slot" data-type="crate">8</div>
                </div>
            </section>
        </div>
    </div>
</div>

<div class="modal-bg" id="modalBg">
    <form class="modal" onsubmit="saveEdit(event)">
        <h2 id="modalTitle">Change</h2>
        <input id="editInput" type="text">
        <div class="modal-actions">
            <button type="button" onclick="closeEdit()">Cancel</button>
            <button type="submit">Save</button>
        </div>
    </form>
</div>

<script>
const DEFAULT_PROFILE_PIC = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23fff'%3E%3Cpath d='M12 12c2.7 0 5-2.3 5-5s-2.3-5-5-5-5 2.3-5 5 2.3 5 5 5zm0 2c-3.3 0-10 1.7-10 5v2h20v-2c0-3.3-6.7-5-10-5z'/%3E%3C/svg%3E";
const GAME_ID = "case-clicker";
const API_CANDIDATES = getApiCandidates();

let editing = "";
let viewer = null;
let activeProfile = null;
let canEdit = false;
let activeStats = {level: 0, money: 0, inventoryCount: 0, totalCasesOpened: 0};

const els = {
    burger: document.getElementById("burger"),
    menu: document.getElementById("menu"),
    accountPage: document.getElementById("accountPage"),
    authButtons: document.getElementById("authButtons"),
    accountChip: document.getElementById("accountChip"),
    accountName: document.getElementById("accountName"),
    accountMenuLink: document.getElementById("accountMenuLink"),
    avatar: document.getElementById("avatar"),
    picUpload: document.getElementById("picUpload"),
    bigPic: document.getElementById("bigPic"),
    smallPic: document.getElementById("smallPic"),
    usernameText: document.getElementById("usernameText"),
    emailText: document.getElementById("emailText"),
    infoName: document.getElementById("infoName"),
    infoId: document.getElementById("infoId"),
    infoMail: document.getElementById("infoMail"),
    infoLevel: document.getElementById("infoLevel"),
    infoCoins: document.getElementById("infoCoins"),
    infoSync: document.getElementById("infoSync"),
    warning: document.getElementById("warning"),
    inventory: document.getElementById("inventory"),
    inventoryGrid: document.getElementById("inventoryGrid"),
    modalBg: document.getElementById("modalBg"),
    modalTitle: document.getElementById("modalTitle"),
    editInput: document.getElementById("editInput")
};

els.burger.onclick = function() {
    els.menu.classList.toggle("show");
};

document.addEventListener("click", function(event) {
    if (!els.menu.contains(event.target) && !els.burger.contains(event.target)){
        els.menu.classList.remove("show");
    }
});

function getApiCandidates() {
    const host = window.location.hostname || "localhost";
    const protocol = window.location.protocol === "file:" ? "http:" : window.location.protocol;
    const candidates = [];

    if (window.location.protocol !== "file:" && window.location.port === "8090") {
        candidates.push(`${window.location.origin}/api`);
    }

    if (window.location.protocol !== "file:" && (window.location.port === "5000" || window.location.port === "5001")) {
        candidates.push(`${window.location.origin}/api`);
    }

    candidates.push(`${protocol}//${host}:5001/api`);
    candidates.push(`${protocol}//${host}:5000/api`);

    return [...new Set(candidates)];
}

async function apiFetch(path, options = {}) {
    let lastError = null;

    for (const baseUrl of API_CANDIDATES) {
        try {
            const res = await fetch(`${baseUrl}${path}`, options);
            const text = await res.text();
            const data = text ? JSON.parse(text) : {};

            if (!res.ok) {
                const error = new Error(data.errorMessage || "Request failed");
                error.status = res.status;
                error.data = data;
                throw error;
            }

            return data;
        } catch (error) {
            lastError = error;
            if (error.status) throw error;
        }
    }

    throw lastError || new Error("Could not connect to server");
}

function getToken() {
    return localStorage.getItem("token");
}

function authHeaders() {
    return {
        "Content-Type": "application/json",
        Authorization: `Bearer ${getToken()}`
    };
}

function requestedAccountId() {
    const id = Number(new URLSearchParams(window.location.search).get("id"));
    return Number.isInteger(id) && id > 0 ? id : null;
}

function syncKey(accountId) {
    return `gameSynced:${accountId}`;
}

function escapeHtml(value) {
    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

function formatNumber(value) {
    return Number(value || 0).toLocaleString("sv-SE");
}

function persistSessionUser(user) {
    localStorage.setItem("accountId", user.id);
    localStorage.setItem("username", user.username || "");
    localStorage.setItem("email", user.email || "");
    localStorage.setItem("isAdmin", user.is_admin ? "true" : "false");
    localStorage.setItem("profilePicture", user.profile_picture || "");
}

function clearSessionUser() {
    localStorage.removeItem("token");
    localStorage.removeItem("accountId");
    localStorage.removeItem("username");
    localStorage.removeItem("email");
    localStorage.removeItem("isAdmin");
    localStorage.removeItem("profilePicture");
}

async function loadViewer() {
    if (!getToken()) return null;

    try {
        const data = await apiFetch("/users/me", {
            headers: authHeaders()
        });
        return data.user;
    } catch (error) {
        if (error.status === 401 || error.status === 404) {
            clearSessionUser();
            return null;
        }
        throw error;
    }
}

async function loadPublicProfile(accountId) {
    const data = await apiFetch(`/users/${encodeURIComponent(accountId)}`);
    return data.user;
}

function renderHeader() {
    if (!viewer) {
        els.authButtons.style.display = "flex";
        els.accountChip.style.display = "none";
        return;
    }

    els.authButtons.style.display = "none";
    els.accountChip.style.display = "flex";
    els.accountName.textContent = viewer.username || viewer.email || "Logged in";
    els.smallPic.src = viewer.profile_picture || DEFAULT_PROFILE_PIC;
    els.accountMenuLink.href = `account.html?id=${encodeURIComponent(viewer.id)}`;
}

function renderEditMode() {
    els.accountPage.classList.toggle("view-only", !canEdit);
    document.querySelectorAll(".change-btn").forEach((button) => {
        button.disabled = !canEdit;
    });

    els.picUpload.disabled = !canEdit;
    if (canEdit) {
        els.avatar.setAttribute("for", "picUpload");
    } else {
        els.avatar.removeAttribute("for");
    }
}

function renderProfile(profile) {
    const username = profile?.username || "USER NAME";
    const email = canEdit ? profile?.email || "MAIL" : "Private";
    const picture = profile?.profile_picture || "";

    document.title = canEdit ? "CS Clicker - Your Account" : `CS Clicker - ${username}`;
    els.usernameText.textContent = username;
    els.emailText.textContent = email;
    els.infoName.textContent = `Name: ${username}`;
    els.infoId.textContent = `ID: ${profile?.id || "Unknown"}`;
    els.infoMail.textContent = `Mail: ${email}`;

    if (picture) {
        els.bigPic.src = picture;
        if (canEdit || !viewer) {
            els.smallPic.src = picture;
        }
        els.avatar.classList.add("has-pic");
    } else {
        els.bigPic.removeAttribute("src");
        if (canEdit || !viewer) {
            els.smallPic.src = DEFAULT_PROFILE_PIC;
        }
        els.avatar.classList.remove("has-pic");
    }

    renderStats(profile?.stats || activeStats);
    updateSyncState();
}

function renderStats(stats) {
    activeStats = {
        level: Number(stats?.level || 0),
        money: Number(stats?.money || 0),
        inventoryCount: Number(stats?.inventoryCount || 0),
        totalCasesOpened: Number(stats?.totalCasesOpened || 0)
    };

    els.infoLevel.textContent = `Level: ${formatNumber(activeStats.level)}`;
    els.infoCoins.textContent = `Coins: ${formatNumber(activeStats.money)}`;
}

function updateSyncState() {
    if (!activeProfile || !canEdit) {
        els.warning.style.display = "none";
        els.infoSync.textContent = "View only";
        return;
    }

    const synced = localStorage.getItem(syncKey(activeProfile.id)) === "true";
    els.infoSync.textContent = synced ? "Synced" : "Not synced";
    els.warning.style.display = synced ? "none" : "block";
}

async function loadOwnerStats() {
    const stats = {level: 0, money: 0, inventoryCount: 0, totalCasesOpened: 0};

    try {
        const save = await apiFetch(`/saves/load/${encodeURIComponent(GAME_ID)}`, {
            headers: authHeaders()
        });
        const snapshot = save.snapshot || {};
        stats.level = Number(snapshot.level || 0);
        stats.money = Number(snapshot.money || 0);
        stats.inventoryCount = Number(snapshot.inventoryCount || 0);
        stats.totalCasesOpened = Number(snapshot.stats?.totalCasesOpened || 0);
    } catch (error) {}

    try {
        const balance = await apiFetch("/inventory/balance", {
            headers: authHeaders()
        });
        if (balance.balance !== undefined) {
            stats.money = Number(balance.balance);
        }
    } catch (error) {}

    renderStats(stats);
}

function inventoryType(item) {
    if (item.crate_id) return "crate";
    if (item.weapon_type) return "weapon";
    return "skin";
}

function inventoryLabel(item, index) {
    return item.name || item.display_name || `Item ${index + 1}`;
}

function attachSlotHandlers() {
    document.querySelectorAll(".slot").forEach(function(slot) {
        slot.onclick = function() {
            if (!slot.classList.contains("empty")) {
                slot.classList.toggle("selected");
            }
        };
    });
}

function applyInventoryFilter(filter) {
    document.querySelectorAll(".slot").forEach(slot => {
        slot.style.display = filter === "all" || slot.dataset.type === filter ? "grid" : "none";
    });
}

function renderInventory(items) {
    if (!items.length) {
        els.inventoryGrid.innerHTML = `<div class="slot empty">Empty</div>`;
        attachSlotHandlers();
        return;
    }

    els.inventoryGrid.innerHTML = items.map((item, index) => {
        const type = inventoryType(item);
        const label = inventoryLabel(item, index);
        return `<div class="slot" data-type="${escapeHtml(type)}" title="${escapeHtml(label)}">${escapeHtml(label)}</div>`;
    }).join("");

    const activeFilter = document.querySelector(".filter-btn.active")?.dataset.filter || "all";
    applyInventoryFilter(activeFilter);
    attachSlotHandlers();
}

async function loadInventory() {
    if (!canEdit) {
        els.inventory.classList.remove("show");
        els.inventoryGrid.innerHTML = "";
        return;
    }

    try {
        const data = await apiFetch("/inventory", {
            headers: authHeaders()
        });
        renderInventory(data.inventory || []);
    } catch (error) {
        els.inventoryGrid.innerHTML = `<div class="slot empty">Could not load inventory</div>`;
    }
}

function renderError(message) {
    els.accountPage.classList.add("view-only");
    els.usernameText.textContent = message;
    els.emailText.textContent = "Unavailable";
    els.infoName.textContent = message;
    els.infoId.textContent = "ID: Unknown";
    els.infoMail.textContent = "Mail: Unavailable";
    renderStats({});
    els.warning.style.display = "none";
    els.infoSync.textContent = "Unavailable";
}

async function initAccountPage() {
    const accountId = requestedAccountId();

    try {
        viewer = await loadViewer();
        renderHeader();

        if (!viewer && !accountId) {
            window.location.href = "login-signin.html#login";
            return;
        }

        const profileId = accountId || viewer.id;
        canEdit = Boolean(viewer && Number(viewer.id) === Number(profileId));
        activeProfile = canEdit ? viewer : await loadPublicProfile(profileId);

        if (canEdit) {
            persistSessionUser(viewer);
        }

        renderEditMode();
        renderProfile(activeProfile);

        if (canEdit) {
            await loadOwnerStats();
        }

        await loadInventory();
    } catch (error) {
        renderHeader();
        renderEditMode();
        renderError(error.message || "Could not load account");
    }
}

function openEdit(field) {
    if (!canEdit || !activeProfile) return;

    editing = field;
    els.modalTitle.textContent = field === "username" ? "Change user name" : "Change mail";
    els.editInput.type = field === "email" ? "email" : "text";
    els.editInput.value = activeProfile[field] || "";
    els.modalBg.classList.add("show");
}

function closeEdit() {
    els.modalBg.classList.remove("show");
}

async function saveEdit(event) {
    event.preventDefault();

    if (!canEdit || !activeProfile) {
        alert("You can only edit your own account.");
        return;
    }

    const value = els.editInput.value.trim();
    if (!value) return;

    const body = {};
    body[editing] = value;

    try{
        const data = await apiFetch("/users/update", {
            method: "PUT",
            headers: authHeaders(),
            body: JSON.stringify(body)
        });

        activeProfile = {...activeProfile, ...data.user};
        viewer = {...viewer, ...data.user};
        persistSessionUser(viewer);
        closeEdit();
        renderHeader();
        renderProfile(activeProfile);
    }
    catch(error){
        alert(error.message || "Update failed");
    }
}

async function changePic(event) {
    if (!canEdit || !activeProfile) return;

    const file = event.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = async function() {
        try {
            const data = await apiFetch("/users/update", {
                method: "PUT",
                headers: authHeaders(),
                body: JSON.stringify({profile_picture: reader.result})
            });

            activeProfile = {...activeProfile, ...data.user};
            viewer = {...viewer, ...data.user};
            persistSessionUser(viewer);
            renderHeader();
            renderProfile(activeProfile);
        } catch (error) {
            alert(error.message || "Could not update picture");
        }
    };
    reader.readAsDataURL(file);
}

function syncGame() {
    if (!canEdit || !activeProfile) return;
    localStorage.setItem(syncKey(activeProfile.id), "true");
    updateSyncState();
}

function toggleInventory() {
    if (canEdit) {
        els.inventory.classList.toggle("show");
    }
}

document.querySelectorAll(".filter-btn").forEach(btn => {
    btn.addEventListener("click", function() {
        document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
        this.classList.add("active");
        applyInventoryFilter(this.dataset.filter);
    });
});

function goLogin() {
    window.location.href = "login-signin.html#login";
}

function goSignup() {
    window.location.href = "login-signin.html#signup";
}

function goAccount() {
    if (viewer) {
        window.location.href = `account.html?id=${encodeURIComponent(viewer.id)}`;
        return;
    }
    window.location.href = "login-signin.html#login";
}

initAccountPage();
</script>

</body>
</html>
