<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CS Clicker - Account</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    background: linear-gradient(135deg, #ececec, #d9d9d9);
}

.header {
    display: flex;
    align-items: center;
    padding: 15px;
    position: relative;
}

.burger {
    cursor: pointer;
}

.burger svg,
.title,
button,
.slot,
.avatar {
    transition: 0.3s;
}

.burger:hover svg,
button:hover,
.avatar:hover {
    transform: scale(1.05);
    filter: drop-shadow(0 0 6px #4a6cff);
}

.title {
    margin: auto;
    background: #ddd;
    padding: 10px 30px;
    border-radius: 20px;
    font-size: 32px;
}

.title:hover {
    box-shadow: 0 0 8px #4a6cff;
}

.menu {
    display: none;
    flex-direction: column;
    position: absolute;
    top: 60px;
    left: 10px;
    background: #eee;
    padding: 15px;
    border-radius: 12px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    z-index: 10;
}

.menu.show {
    display: flex;
}

.menu a {
    padding: 10px;
    color: #333;
    text-decoration: none;
    border-radius: 8px;
}

.menu a:hover {
    background: #4a6cff;
    color: white;
}

.auth {
    display: flex;
    gap: 10px;
}

.auth button,
.change-btn,
.toggle-btn,
.modal button {
    border: none;
    color: white;
    cursor: pointer;
}

.signup-btn {
    background: #2f4bb2;
    padding: 8px 16px;
    border-radius: 20px;
}

.login-btn {
    background: #5a6c8f;
    padding: 8px 16px;
    border-radius: 20px;
}

.account-chip {
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 4px;
}

.user-icon {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: #5a6c8f;
    cursor: pointer;
    overflow: hidden;
}

.user-icon img,
.avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.account-name {
    max-width: 120px;
    font-size: 13px;
    font-weight: bold;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
}

.logout-btn {
    border: none;
    background: #4a4747;
    color: white;
    padding: 5px 10px;
    border-radius: 12px;
    cursor: pointer;
    font-size: 12px;
}

.account-page {
    padding: 30px;
    min-height: calc(100vh - 92px);
}

.profile-box {
    background: #d9d9d9;
    min-height: 205px;
    display: flex;
    align-items: center;
    gap: 34px;
    padding: 8px 0;
}

.avatar {
    width: 138px;
    height: 138px;
    border-radius: 50%;
    background: #a6a2a2;
    cursor: pointer;
    overflow: hidden;
    position: relative;
}

.avatar img {
    display: none;
}

.avatar.has-pic img {
    display: block;
}

.avatar.has-pic::before,
.avatar.has-pic::after {
    display: none;
}

.avatar::before {
    content: "";
    position: absolute;
    top: 34px;
    left: 48px;
    width: 35px;
    height: 35px;
    border: 6px solid #000;
    border-radius: 50%;
}

.avatar::after {
    content: "";
    position: absolute;
    top: 76px;
    left: 37px;
    width: 55px;
    height: 42px;
    border: 6px solid #000;
    border-bottom: none;
    border-radius: 50px 50px 0 0;
}

.profile-info {
    display: flex;
    flex-direction: column;
    gap: 14px;
}

.row {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 0;
}

.pill {
    display: inline-flex;
    align-items: center;
    justify-content: flex-start;
    width: fit-content;
    max-width: 360px;
    min-width: 0;
    height: 40px;
    background: #4a4747;
    color: white;
    border-radius: 28px;
    padding: 0 20px;
    line-height: 40px;
    font-size: 24px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.change-btn {
    width: 126px;
    height: 40px;
    background: #4a4747;
    border-radius: 22px;
    font-size: 20px;
}

.account-page.view-only .change-btn,
.account-page.view-only .toggle-btn {
    display: none;
}

.account-page.view-only .avatar {
    cursor: default;
    pointer-events: none;
}

.main-area {
    display: flex;
    gap: 74px;
    margin-top: 10px;
}

.warning {
    width: 334px;
    height: 38px;
    background: #ff8585;
    line-height: 38px;
    text-align: center;
    font-size: 21px;
    cursor: pointer;
}

.card {
    width: 334px;
    height: 537px;
    background: #d9d9d9;
    margin-top: 9px;
    padding-top: 28px;
}

.card h1 {
    text-align: center;
    font-size: 32px;
    font-weight: normal;
    margin-bottom: 29px;
}

.info-box {
    width: 298px;
    height: 441px;
    margin: auto;
    background: #929292;
    padding-top: 24px;
}

.info-row {
    width: 219px;
    height: 41px;
    background: #d9d9d9;
    margin: 0 auto 27px;
    padding: 0 12px;
    line-height: 41px;
    font-size: 18px;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
}

.inventory-area {
    flex: 1;
    padding-top: 22px;
}   

.toggle-btn {
    width: 150px;
    height: 64px;
    background: #868686;
    border-radius: 22px;
    font-size: 21px;
}

.inventory {
    display: none;
    width: 100%;
    min-height: 650px;
    margin-top: 16px;
    background: #eeeeee;
    border: 1px solid #cfcfcf;
    border-radius: 8px;
    box-shadow: none;
    padding: 24px;
    overflow: hidden;
}

.inventory.show {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 340px;
    gap: 18px;
}

.inventory-head {
    grid-column: 1 / -1;
    display: grid;
    grid-template-columns: minmax(220px, 1fr) auto;
    align-items: center;
    gap: 18px;
    padding: 0 180px 4px 0;
}

.inventory-title-group {
    min-width: 0;
}

.inventory h2 {
    max-width: 100%;
    color: #222;
    padding: 0;
    text-align: left;
    font-weight: 500;
    font-size: 32px;
    line-height: 1.1;
    margin-bottom: 6px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.inventory-meta {
    min-height: 20px;
    margin-bottom: 0;
    text-align: left;
    color: #666;
    font-size: 14px;
}

.filters {
    display: flex;
    align-items: center;
    justify-content: center;
    justify-self: start;
    gap: 2px;
    margin-bottom: 0;
    background: #dedede;
    border: 1px solid #c8c8c8;
    border-radius: 6px;
    padding: 4px;
    position: relative;
}

.filters::before {
    content: "Sort by";
    position: absolute;
    top: -24px;
    left: 2px;
    background: transparent;
    color: #666;
    padding: 0;
    font-size: 13px;
    font-weight: 500;
}

.filter-btn {
    min-width: 68px;
    background: transparent;
    color: #333;
    border: none;
    padding: 10px 12px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 500;
}

.filter-btn:hover,
.filter-btn.active {
    background: #777;
    color: white;
    box-shadow: none;
}

.inventory-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(116px, 1fr));
    align-content: start;
    gap: 12px;
    min-height: 500px;
    max-height: calc(100vh - 260px);
    background: #d0d0d0;
    border: 1px solid #bdbdbd;
    border-radius: 8px;
    padding: 16px;
    overflow-y: auto;
}

.slot {
    width: 100%;
    aspect-ratio: 1;
    min-height: 0;
    background: #eeeeee;
    border: 1px solid #bababa;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 12px;
    cursor: pointer;
    overflow: hidden;
    color: #333;
    box-shadow: none;
}

.slot:hover,
.slot.selected {
    background: #f8f8f8;
    border-color: #555;
    box-shadow: none;
    color: #222;
}

.slot-image {
    width: 78%;
    height: 78%;
    object-fit: contain;
    flex: 0 0 auto;
}

.slot-name {
    width: 84%;
    font-weight: bold;
    font-size: 18px;
    line-height: 1.2;
    text-align: center;
    overflow-wrap: anywhere;
}

.slot-meta {
    display: none;
}

.slot:hover .slot-meta,
.slot.selected .slot-meta {
    color: white;
}

.slot.empty {
    grid-column: 1 / -1;
    width: 100%;
    min-height: 96px;
    aspect-ratio: auto;
    border-radius: 8px;
    cursor: default;
    color: #666;
    align-items: center;
    justify-content: center;
    text-align: center;
    background: #e7e7e7;
}

.slot.empty:hover {
    background: #e7e7e7;
    color: #666;
    transform: none;
    filter: none;
    border-color: #c4cbd8;
    box-shadow: none;
}

.item-details {
    display: none;
    align-self: start;
    min-height: 306px;
    background: #eeeeee;
    border: 1px solid #c8c8c8;
    border-radius: 8px;
    padding: 22px;
    color: #222;
    box-shadow: none;
}

.item-details.show {
    display: block;
}

.item-details-top {
    display: grid;
    grid-template-columns: 96px 1fr;
    gap: 14px;
    margin-bottom: 20px;
}

.item-details-icon {
    min-height: 96px;
    background: #d8d8d8;
    border: 1px solid #c4c4c4;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 12px;
    color: #333;
    font-weight: 700;
    text-align: center;
    overflow-wrap: anywhere;
}

.item-details-icon img {
    width: 100%;
    height: 100%;
    object-fit: contain;
}

.item-details-lines {
    display: grid;
    align-content: start;
    gap: 8px;
}

.detail-line {
    min-height: 30px;
    background: #d8d8d8;
    border: 1px solid #c4c4c4;
    border-radius: 4px;
    padding: 7px 10px;
    font-size: 13px;
    line-height: 1.15;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.detail-line.wide {
    margin-bottom: 8px;
    text-align: left;
}

.account-page.inventory-open .profile-box {
    display: none;
}

.account-page.inventory-open .main-area {
    display: block;
    margin-top: 0;
}

.account-page.inventory-open .account-summary {
    display: none;
}

.account-page.inventory-open .inventory-area {
    padding-top: 0;
    position: relative;
}

.account-page.inventory-open .toggle-btn {
    position: absolute;
    top: 28px;
    right: 28px;
    width: 136px;
    height: 44px;
    margin: 0;
    border-radius: 6px;
    background: #555;
    color: white;
    font-size: 15px;
    font-weight: 600;
    box-shadow: none;
    z-index: 2;
}

.account-page.inventory-open .toggle-btn:hover {
    background: #333;
    filter: none;
    transform: translateY(-1px);
}

.account-page.inventory-open .inventory {
    margin-top: 0;
}

.modal-bg {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.25);
    justify-content: center;
    align-items: center;
}

.modal-bg.show {
    display: flex;
}

.modal {
    width: 360px;
    background: #d9d9d9;
    border: 8px solid #929292;
    padding: 22px;
}

.modal h2 {
    margin-bottom: 15px;
    font-weight: normal;
}

.modal input {
    width: 100%;
    height: 40px;
    margin-bottom: 15px;
    padding: 5px 10px;
    font-size: 18px;
}

.modal-actions {
    display: flex;
    justify-content: flex-end;
    gap: 10px;
}

.modal button {
    background: #4a4747;
    padding: 9px 15px;
    border-radius: 15px;
}

@media (max-width: 800px) {
    .profile-box,
    .main-area {
        flex-direction: column;
        gap: 20px;
    }

    .row {
        gap: 12px;
        margin-bottom: 20px;
    }

    .pill {
        width: 210px;
        font-size: 22px;
    }

    .inventory.show {
        grid-template-columns: 1fr;
    }

    .inventory-head {
        grid-template-columns: 1fr;
        padding-right: 0;
    }

    .inventory h2 {
        min-width: 0;
        font-size: 28px;
    }

    .filters {
        margin-top: 34px;
        flex-wrap: wrap;
    }

    .inventory-grid {
        grid-template-columns: repeat(auto-fill, minmax(84px, 1fr));
        padding: 22px;
        max-height: none;
    }

    .account-page.inventory-open .toggle-btn {
        position: static;
        margin: 0 0 12px auto;
        display: block;
    }
}
</style>
</head>

<body>

<div class="header">
    <div class="burger" id="burger">
        <svg xmlns="http://www.w3.org/2000/svg" width="50" height="50" fill="currentColor" viewBox="0 0 15 15">
            <path fill-rule="evenodd" d="M2.5 12a.5.5 0 0 1 .5-.5h10a.5.5 0 0 1 0 1H3a.5.5 0 0 1-.5-.5m0-4a.5.5 0 0 1 .5-.5h10a.5.5 0 0 1 0 1H3a.5.5 0 0 1-.5-.5m0-4a.5.5 0 0 1 .5-.5h10a.5.5 0 0 1 0 1H3a.5.5 0 0 1-.5-.5"/>
        </svg>
    </div>

    <div class="title">CS-Clicker Account</div>

    <nav class="menu" id="menu">
        <a href="index.html">Home</a>
        <a href="game/patch-download.html">Patch & Download</a>
        <a href="game/gameinf.html">Game info</a>
        <a href="leaderboard.html">Leaderboard</a>
        <a href="account.html" id="accountMenuLink">Account</a>
    </nav>

    <div class="auth" id="authButtons">
        <button class="signup-btn" onclick="goSignup()">SIGN UP</button>
        <button class="login-btn" onclick="goLogin()">LOGIN</button>
    </div>

    <div class="account-chip" id="accountChip">
        <div class="user-icon" onclick="goAccount()">
            <img id="smallPic" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23fff'%3E%3Cpath d='M12 12c2.7 0 5-2.3 5-5s-2.3-5-5-5-5 2.3-5 5 2.3 5 5 5zm0 2c-3.3 0-10 1.7-10 5v2h20v-2c0-3.3-6.7-5-10-5z'/%3E%3C/svg%3E">
        </div>
        <div class="account-name" id="accountName"></div>
        <button class="logout-btn" onclick="logout()">Logout</button>
    </div>
</div>

<div class="account-page" id="accountPage">
    <section class="profile-box">
        <label class="avatar" id="avatar" for="picUpload">
            <img id="bigPic">
            <input type="file" id="picUpload" accept="image/*" style="display:none" onchange="changePic(event)">
        </label>

        <div class="profile-info">
            <div class="row">
                <div class="pill" id="usernameText">USER NAME</div>
                <button class="change-btn" onclick="openEdit('username')">Change</button>
            </div>

            <div class="row">
                <div class="pill" id="emailText">MAIL</div>
            </div>
        </div>
    </section>

    <div class="main-area">
        <div class="account-summary">
            <div class="warning" id="warning" onclick="syncGame()">Account not synced with game</div>

            <section class="card">
                <h1>Account info</h1>
                <div class="info-box">
                    <div class="info-row" id="infoName"></div>
                    <div class="info-row" id="infoId"></div>
                    <div class="info-row" id="infoMail"></div>
                    <div class="info-row" id="infoLevel">Level: 0</div>
                    <div class="info-row" id="infoCoins">Coins: 0</div>

        <div class="inventory-area">
            <button class="toggle-btn" id="inventoryToggle" onclick="toggleInventory()">TOGGLE<br>INVENTORY</button>

            <section class="inventory" id="inventory">
                <div class="inventory-head">
                    <div></div>
                    <div class="inventory-title-group">
                        <h2 id="inventoryTitle">Inventory</h2>
                        <div class="inventory-meta" id="inventoryMeta"></div>
                    </div>
                    <div class="filters">
                        <button class="filter-btn active" data-sort="value">Value</button>
                        <button class="filter-btn" data-sort="date">Date</button>
                        <button class="filter-btn" data-sort="fav">Fav</button>
                        <button class="filter-btn" data-sort="type">Type</button>
                    </div>
                </div>
                <div class="inventory-grid" id="inventoryGrid"></div>
                <aside class="item-details" id="itemDetails" aria-live="polite"></aside>
            </section>
        </div>
    </div>
</div>

<div class="modal-bg" id="modalBg">
    <form class="modal" onsubmit="saveEdit(event)">
        <h2 id="modalTitle">Change</h2>
        <input id="editInput" type="text">
        <div class="modal-actions">
            <button type="button" onclick="closeEdit()">Cancel</button>
            <button type="submit">Save</button>
        </div>
    </form>
</div>

<script>
const DEFAULT_PROFILE_PIC = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23fff'%3E%3Cpath d='M12 12c2.7 0 5-2.3 5-5s-2.3-5-5-5-5 2.3-5 5 2.3 5 5 5zm0 2c-3.3 0-10 1.7-10 5v2h20v-2c0-3.3-6.7-5-10-5z'/%3E%3C/svg%3E";
const GAME_ID = "case-clicker";
const API_CANDIDATES = getApiCandidates();

let editing = "";
let viewer = null;
let activeProfile = null;
let canEdit = false;
let activeStats = {level: 0, money: 0, inventoryCount: 0, totalCasesOpened: 0};
let hasCloudSave = false;
let checkedCloudSave = false;
let activeInventoryItems = [];
let lastInventoryOptions = {};
let selectedInventoryIndex = -1;
let activeSort = "value";

const els = {
    burger: document.getElementById("burger"),
    menu: document.getElementById("menu"),
    accountPage: document.getElementById("accountPage"),
    authButtons: document.getElementById("authButtons"),
    accountChip: document.getElementById("accountChip"),
    accountName: document.getElementById("accountName"),
    accountMenuLink: document.getElementById("accountMenuLink"),
    avatar: document.getElementById("avatar"),
    picUpload: document.getElementById("picUpload"),
    bigPic: document.getElementById("bigPic"),
    smallPic: document.getElementById("smallPic"),
    usernameText: document.getElementById("usernameText"),
    emailText: document.getElementById("emailText"),
    infoName: document.getElementById("infoName"),
    infoId: document.getElementById("infoId"),
    infoMail: document.getElementById("infoMail"),
    infoLevel: document.getElementById("infoLevel"),
    infoCoins: document.getElementById("infoCoins"),
    infoSync: document.getElementById("infoSync"),
    warning: document.getElementById("warning"),
    inventoryToggle: document.getElementById("inventoryToggle"),
    inventory: document.getElementById("inventory"),
    inventoryTitle: document.getElementById("inventoryTitle"),
    inventoryMeta: document.getElementById("inventoryMeta"),
    inventoryGrid: document.getElementById("inventoryGrid"),
    itemDetails: document.getElementById("itemDetails"),
    modalBg: document.getElementById("modalBg"),
    modalTitle: document.getElementById("modalTitle"),
    editInput: document.getElementById("editInput")
};

els.burger.onclick = function() {
    els.menu.classList.toggle("show");
};

document.addEventListener("click", function(event) {
    if (!els.menu.contains(event.target) && !els.burger.contains(event.target)){
        els.menu.classList.remove("show");
    }
});

function getApiCandidates() {
    const host = window.location.hostname || "localhost";
    const protocol = window.location.protocol === "file:" ? "http:" : window.location.protocol;
    const candidates = [];

    if (window.location.protocol !== "file:" && window.location.port === "8090") {
        candidates.push(`${window.location.origin}/api`);
    }

    if (window.location.protocol !== "file:" && (window.location.port === "5000" || window.location.port === "5001")) {
        candidates.push(`${window.location.origin}/api`);
    }

    candidates.push(`${protocol}//${host}:5001/api`);
    candidates.push(`${protocol}//${host}:5000/api`);

    return [...new Set(candidates)];
}

async function apiFetch(path, options = {}) {
    let lastError = null;

    for (const baseUrl of API_CANDIDATES) {
        try {
            const res = await fetch(`${baseUrl}${path}`, options);
            const text = await res.text();
            const data = text ? JSON.parse(text) : {};

            if (!res.ok) {
                const error = new Error(data.errorMessage || "Request failed");
                error.status = res.status;
                error.data = data;
                throw error;
            }

            return data;
        } catch (error) {
            lastError = error;
            if (error.status) throw error;
        }
    }

    throw lastError || new Error("Could not connect to server");
}

function getToken() {
    return localStorage.getItem("token");
}

function authHeaders() {
    return {
        "Content-Type": "application/json",
        Authorization: `Bearer ${getToken()}`
    };
}

function requestedAccountId() {
    const id = Number(new URLSearchParams(window.location.search).get("id"));
    return Number.isInteger(id) && id > 0 ? id : null;
}

function syncKey(accountId) {
    return `gameSynced:${accountId}`;
}

function escapeHtml(value) {
    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

function formatNumber(value) {
    const number = Number(value || 0);
    return Number.isFinite(number) ? number.toLocaleString("sv-SE") : String(value);
}

function persistSessionUser(user) {
    localStorage.setItem("accountId", user.id);
    localStorage.setItem("username", user.username || "");
    localStorage.setItem("email", user.email || "");
    localStorage.setItem("isAdmin", user.is_admin ? "true" : "false");
    localStorage.setItem("profilePicture", user.profile_picture || "");
}

function clearSessionUser() {
    localStorage.removeItem("token");
    localStorage.removeItem("accountId");
    localStorage.removeItem("username");
    localStorage.removeItem("email");
    localStorage.removeItem("isAdmin");
    localStorage.removeItem("profilePicture");
}

function logout() {
    clearSessionUser();
    viewer = null;
    activeProfile = null;
    canEdit = false;
    hasCloudSave = false;
    checkedCloudSave = false;
    renderHeader();
    window.location.href = "login-signin.html#login";
}

async function loadViewer() {
    if (!getToken()) return null;

    try {
        const data = await apiFetch("/users/me", {
            headers: authHeaders()
        });
        return data.user;
    } catch (error) {
        if (error.status === 401 || error.status === 404) {
            clearSessionUser();
            return null;
        }
        throw error;
    }
}

async function loadPublicProfile(accountId) {
    const data = await apiFetch(`/users/${encodeURIComponent(accountId)}`);
    return data.user;
}

function renderHeader() {
    if (!viewer) {
        els.authButtons.style.display = "flex";
        els.accountChip.style.display = "none";
        return;
    }

    els.authButtons.style.display = "none";
    els.accountChip.style.display = "flex";
    els.accountName.textContent = viewer.username || viewer.email || "Logged in";
    els.smallPic.src = viewer.profile_picture || DEFAULT_PROFILE_PIC;
    els.accountMenuLink.href = `account.html?id=${encodeURIComponent(viewer.id)}`;
}

function renderEditMode() {
    els.accountPage.classList.toggle("view-only", !canEdit);
    document.querySelectorAll(".change-btn").forEach((button) => {
        button.disabled = !canEdit;
    });

    els.picUpload.disabled = !canEdit;
    if (canEdit) {
        els.avatar.setAttribute("for", "picUpload");
    } else {
        els.avatar.removeAttribute("for");
    }
}

function renderProfile(profile) {
    const username = profile?.username || "USER NAME";
    const email = canEdit ? profile?.email || "MAIL" : "Private";
    const picture = profile?.profile_picture || "";

    document.title = canEdit ? "CS Clicker - Your Account" : `CS Clicker - ${username}`;
    els.inventoryTitle.textContent = `${username}'s Inventory`;
    els.usernameText.textContent = username;
    els.emailText.textContent = email;
    els.infoName.textContent = `Name: ${username}`;
    els.infoId.textContent = `ID: ${profile?.id || "Unknown"}`;
    els.infoMail.textContent = `Mail: ${email}`;

    if (picture) {
        els.bigPic.src = picture;
        if (canEdit || !viewer) {
            els.smallPic.src = picture;
        }
        els.avatar.classList.add("has-pic");
    } else {
        els.bigPic.removeAttribute("src");
        if (canEdit || !viewer) {
            els.smallPic.src = DEFAULT_PROFILE_PIC;
        }
        els.avatar.classList.remove("has-pic");
    }

    renderStats(profile?.stats || activeStats);
    updateSyncState();
}

function renderStats(stats) {
    activeStats = {
        level: Number(stats?.level || 0),
        money: Number(stats?.money || 0),
        inventoryCount: Number(stats?.inventoryCount || 0),
        totalCasesOpened: Number(stats?.totalCasesOpened || 0)
    };

    els.infoLevel.textContent = `Level: ${formatNumber(activeStats.level)}`;
    els.infoCoins.textContent = `Coins: ${formatNumber(activeStats.money)}`;
}

function updateSyncState() {
    if (!activeProfile || !canEdit) {
        els.warning.style.display = "none";
        els.infoSync.textContent = "View only";
        return;
    }

    const syncedLocally = localStorage.getItem(syncKey(activeProfile.id)) === "true";
    const synced = syncedLocally || hasCloudSave;

    if (!synced && !checkedCloudSave) {
        els.infoSync.textContent = "Checking...";
        els.warning.style.display = "none";
        return;
    }

    els.infoSync.textContent = synced ? "Synced" : "Not synced";
    els.warning.style.display = synced ? "none" : "block";
}

async function loadOwnerSnapshot() {
    try {
        const save = await apiFetch(`/saves/load/${encodeURIComponent(GAME_ID)}`, {
            headers: authHeaders()
        });
        const snapshot = save.snapshot || null;
        hasCloudSave = Boolean(snapshot);
        checkedCloudSave = true;
        const items = normalizeInventory(snapshot);

        renderStats(statsFromSnapshot(snapshot, items));
        renderInventory(items, {
            emptyMessage: snapshot ? "Inventory is empty in your latest game save." : "No cloud save found yet.",
            updatedAt: save.updatedAt || snapshot?.savedAt,
            declaredCount: Number(snapshot?.inventoryCount ?? items.length)
        });
        updateSyncState();
    } catch (error) {
        hasCloudSave = false;
        checkedCloudSave = true;
        renderStats({});
        renderInventory([], {
            emptyMessage: "Could not load game inventory from cloud save."
        });
        updateSyncState();
    }
}

function statsFromSnapshot(snapshot, items) {
    if (!snapshot) {
        return {level: 0, money: 0, inventoryCount: 0, totalCasesOpened: 0};
    }

    return {
        level: Number(snapshot.level || 0),
        money: Number(snapshot.money || snapshot.coins || snapshot.balance || 0),
        inventoryCount: Number(snapshot.inventoryCount ?? items.length),
        totalCasesOpened: Number(snapshot.stats?.totalCasesOpened || snapshot.totalCasesOpened || 0)
    };
}

function normalizeInventory(snapshot) {
    if (!snapshot) return [];

    const rawInventory = snapshot.inventory || snapshot.items || snapshot.skins || [];

    if (Array.isArray(rawInventory)) {
        return rawInventory;
    }

    if (rawInventory && typeof rawInventory === "object") {
        return Object.entries(rawInventory).map(([key, value]) => {
            if (value && typeof value === "object" && !Array.isArray(value)) {
                return {
                    id: value.id || key,
                    ...value,
                    name: value.name || value.displayName || value.display_name || key
                };
            }

            return {
                id: key,
                name: key,
                count: value
            };
        });
    }

    return [];
}

function pickFirst(item, keys) {
    if (!item || typeof item !== "object") return "";

    for (const key of keys) {
        if (item[key] !== undefined && item[key] !== null && item[key] !== "") {
            return item[key];
        }
    }

    return "";
}

function inventoryType(item) {
    if (!item || typeof item !== "object") return "skin";

    const explicitType = String(pickFirst(item, ["type", "itemType", "item_type", "category", "class"]) || "").toLowerCase();
    const name = String(pickFirst(item, ["name", "displayName", "display_name"]) || "").toLowerCase();

    if (explicitType.includes("key") || name.includes(" key")) return "key";
    if (item.crate_id || explicitType.includes("crate") || explicitType.includes("case") || name.includes(" case")) return "case";
    if (explicitType.includes("weapon")) return "weapon";
    if (explicitType.includes("skin")) return "skin";

    return "skin";
}

function inventoryLabel(item, index) {
    if (typeof item === "string") return item;
    if (typeof item === "number") return `Item ${index + 1}`;

    return pickFirst(item, [
        "name",
        "displayName",
        "display_name",
        "skinName",
        "skin_name",
        "itemName",
        "item_name",
        "weaponName",
        "weapon_name"
    ]) || `Item ${index + 1}`;
}

function inventoryImage(item) {
    return pickFirst(item, [
        "image",
        "imageUrl",
        "image_url",
        "icon",
        "iconUrl",
        "icon_url",
        "thumbnail",
        "thumbnailUrl",
        "thumbnail_url"
    ]);
}

function inventoryMeta(item) {
    if (!item || typeof item !== "object") return "";

    const parts = [];
    const rarity = pickFirst(item, ["rarity", "quality", "tier"]);
    const weapon = pickFirst(item, ["weapon", "weaponType", "weapon_type"]);
    const wear = pickFirst(item, ["wear", "float", "floatValue", "float_value"]);
    const price = pickFirst(item, ["price", "value", "marketValue", "market_value", "min_price"]);
    const count = pickFirst(item, ["count", "amount", "quantity", "qty"]);

    if (rarity) parts.push(rarity);
    if (weapon) parts.push(weapon);
    if (wear) parts.push(`Wear ${wear}`);
    if (price) parts.push(`Value ${formatNumber(price)}`);
    if (count && Number(count) > 1) parts.push(`x${count}`);
    if (item.stattrak || item.is_stattrak) parts.push("StatTrak");
    if (item.souvenir || item.is_souvenir) parts.push("Souvenir");

    return parts.join(" | ");
}

function detailValue(item, keys, fallback = "Unknown") {
    const value = pickFirst(item, keys);
    return value === "" ? fallback : value;
}

function itemInitials(label) {
    return String(label || "Item")
        .split(/\s+/)
        .filter(Boolean)
        .slice(0, 2)
        .map(part => part.charAt(0).toUpperCase())
        .join("") || "IT";
}

function clearItemDetails() {
    selectedInventoryIndex = -1;
    els.itemDetails.classList.remove("show");
    els.itemDetails.innerHTML = "";
    document.querySelectorAll(".slot.selected").forEach(slot => slot.classList.remove("selected"));
}

function showItemDetails(index, slot) {
    const item = activeInventoryItems[index];
    if (!item) {
        clearItemDetails();
        return;
    }

    selectedInventoryIndex = index;
    document.querySelectorAll(".slot.selected").forEach(activeSlot => activeSlot.classList.remove("selected"));
    slot.classList.add("selected");

    const label = inventoryLabel(item, index);
    const type = inventoryType(item);
    const image = inventoryImage(item);
    const meta = inventoryMeta(item) || type;
    const rarity = detailValue(item, ["rarity", "quality", "tier"], "No rarity");
    const value = detailValue(item, ["price", "value", "marketValue", "market_value", "min_price"], "No value");
    const weapon = detailValue(item, ["weapon", "weaponType", "weapon_type", "category", "class"], type);
    const count = detailValue(item, ["count", "amount", "quantity", "qty"], "1");

    els.itemDetails.innerHTML = `
        <div class="item-details-top">
            <div class="item-details-icon">
                ${image ? `<img src="${escapeHtml(image)}" alt="">` : escapeHtml(itemInitials(label))}
            </div>
            <div class="item-details-lines">
                <div class="detail-line" title="${escapeHtml(label)}">${escapeHtml(label)}</div>
                <div class="detail-line">Type: ${escapeHtml(type)}</div>
                <div class="detail-line">Value: ${escapeHtml(String(value))}</div>
            </div>
        </div>
        <div class="detail-line wide" title="${escapeHtml(meta)}">${escapeHtml(meta)}</div>
        <div class="detail-line wide">Rarity: ${escapeHtml(String(rarity))}</div>
        <div class="detail-line wide">Weapon: ${escapeHtml(String(weapon))}</div>
        <div class="detail-line wide">Amount: ${escapeHtml(String(count))}</div>
    `;
    els.itemDetails.classList.add("show");
}

function attachSlotHandlers() {
    document.querySelectorAll(".slot").forEach(function(slot) {
        slot.onclick = function() {
            if (!slot.classList.contains("empty")) {
                showItemDetails(Number(slot.dataset.index), slot);
            }
        };
    });
}

function sortInventoryItems(items) {
    return [...items].sort((a, b) => {
        if (activeSort === "type") {
            return inventoryType(a).localeCompare(inventoryType(b));
        }

        if (activeSort === "date") {
            return itemTime(b) - itemTime(a);
        }

        if (activeSort === "fav") {
            return Number(Boolean(b?.favorite || b?.fav || b?.isFavorite)) - Number(Boolean(a?.favorite || a?.fav || a?.isFavorite));
        }

        return itemValue(b) - itemValue(a);
    });
}

function itemValue(item) {
    const raw = detailValue(item, ["price", "value", "marketValue", "market_value", "min_price"], 0);
    const number = Number(String(raw).replace(/[^0-9.-]/g, ""));
    return Number.isFinite(number) ? number : 0;
}

function itemTime(item) {
    const raw = detailValue(item, ["created_at", "createdAt", "date", "acquiredAt", "acquired_at", "timestamp"], 0);
    const number = Number(raw);
    const date = Number.isFinite(number) && number > 0 ? new Date(number * 1000) : new Date(raw);
    return Number.isNaN(date.getTime()) ? 0 : date.getTime();
}

function renderInventory(items, options = {}) {
    lastInventoryOptions = options;
    activeInventoryItems = sortInventoryItems(items);
    clearItemDetails();

    const updatedAt = options.updatedAt ? formatSaveTime(options.updatedAt) : "";
    const displayCount = Number.isFinite(options.declaredCount) ? options.declaredCount : items.length;

    els.inventoryMeta.textContent = updatedAt
        ? `${formatNumber(displayCount)} items from latest game save, updated ${updatedAt}`
        : `${formatNumber(displayCount)} items from latest game save`;

    if (!activeInventoryItems.length) {
        els.inventoryGrid.innerHTML = `<div class="slot empty">${escapeHtml(options.emptyMessage || "Inventory is empty.")}</div>`;
        attachSlotHandlers();
        return;
    }

    els.inventoryGrid.innerHTML = activeInventoryItems.map((item, index) => {
        const type = inventoryType(item);
        const label = inventoryLabel(item, index);
        const image = inventoryImage(item);
        const initials = itemInitials(label);

        return `
            <div class="slot" data-index="${index}" data-type="${escapeHtml(type)}" title="${escapeHtml(label)}">
                ${image ? `<img class="slot-image" src="${escapeHtml(image)}" alt="">` : ""}
                ${image ? "" : `<div class="slot-name">${escapeHtml(initials)}</div>`}
            </div>
        `;
    }).join("");

    attachSlotHandlers();
}

async function loadInventory() {
    if (!canEdit) {
        els.inventory.classList.remove("show");
        els.accountPage.classList.remove("inventory-open");
        els.inventoryToggle.innerHTML = "TOGGLE<br>INVENTORY";
        els.inventoryMeta.textContent = "";
        els.inventoryGrid.innerHTML = "";
        clearItemDetails();
        return;
    }

    await loadOwnerSnapshot();
}

function formatSaveTime(value) {
    if (!value) return "";

    const date = typeof value === "number" || /^\d+$/.test(String(value))
        ? new Date(Number(value) * 1000)
        : new Date(value);

    if (Number.isNaN(date.getTime())) return "";

    return date.toLocaleString("sv-SE", {
        dateStyle: "short",
        timeStyle: "short"
    });
}

function renderError(message) {
    els.accountPage.classList.add("view-only");
    els.usernameText.textContent = message;
    els.emailText.textContent = "Unavailable";
    els.infoName.textContent = message;
    els.infoId.textContent = "ID: Unknown";
    els.infoMail.textContent = "Mail: Unavailable";
    renderStats({});
    els.warning.style.display = "none";
    els.infoSync.textContent = "Unavailable";
}

async function initAccountPage() {
    const accountId = requestedAccountId();

    try {
        hasCloudSave = false;
        checkedCloudSave = false;
        viewer = await loadViewer();
        renderHeader();

        if (!viewer && !accountId) {
            window.location.href = "login-signin.html#login";
            return;
        }

        const profileId = accountId || viewer.id;
        canEdit = Boolean(viewer && Number(viewer.id) === Number(profileId));
        activeProfile = canEdit ? viewer : await loadPublicProfile(profileId);

        if (canEdit) {
            persistSessionUser(viewer);
        }

        renderEditMode();
        renderProfile(activeProfile);

        await loadInventory();
    } catch (error) {
        renderHeader();
        renderEditMode();
        renderError(error.message || "Could not load account");
    }
}

function openEdit(field) {
    if (!canEdit || !activeProfile) return;

    editing = field;
    els.modalTitle.textContent = field === "username" ? "Change user name" : "Change mail";
    els.editInput.type = field === "email" ? "email" : "text";
    els.editInput.value = activeProfile[field] || "";
    els.modalBg.classList.add("show");
}

function closeEdit() {
    els.modalBg.classList.remove("show");
}

async function saveEdit(event) {
    event.preventDefault();

    if (!canEdit || !activeProfile) {
        alert("You can only edit your own account.");
        return;
    }

    const value = els.editInput.value.trim();
    if (!value) return;

    const body = {};
    body[editing] = value;

    try{
        const data = await apiFetch("/users/update", {
            method: "PUT",
            headers: authHeaders(),
            body: JSON.stringify(body)
        });

        activeProfile = {...activeProfile, ...data.user};
        viewer = {...viewer, ...data.user};
        persistSessionUser(viewer);
        closeEdit();
        renderHeader();
        renderProfile(activeProfile);
    }
    catch(error){
        alert(error.message || "Update failed");
    }
}

async function changePic(event) {
    if (!canEdit || !activeProfile) return;

    const file = event.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = async function() {
        try {
            const data = await apiFetch("/users/update", {
                method: "PUT",
                headers: authHeaders(),
                body: JSON.stringify({profile_picture: reader.result})
            });

            activeProfile = {...activeProfile, ...data.user};
            viewer = {...viewer, ...data.user};
            persistSessionUser(viewer);
            renderHeader();
            renderProfile(activeProfile);
        } catch (error) {
            alert(error.message || "Could not update picture");
        }
    };
    reader.readAsDataURL(file);
}

function syncGame() {
    if (!canEdit || !activeProfile) return;
    localStorage.setItem(syncKey(activeProfile.id), "true");
    updateSyncState();
}

function toggleInventory() {
    if (canEdit) {
        const isOpen = els.inventory.classList.toggle("show");
        els.accountPage.classList.toggle("inventory-open", isOpen);
        els.inventoryToggle.innerHTML = isOpen ? "&larr; BACK" : "TOGGLE<br>INVENTORY";
        if (!isOpen) {
            clearItemDetails();
        }
    }
}

document.querySelectorAll(".filter-btn").forEach(btn => {
    btn.addEventListener("click", function() {
        document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
        this.classList.add("active");
        activeSort = this.dataset.sort || "value";
        renderInventory(activeInventoryItems, lastInventoryOptions);
    });
});

function goLogin() {
    window.location.href = "login-signin.html#login";
}

function goSignup() {
    window.location.href = "login-signin.html#signup";
}

function goAccount() {
    if (viewer) {
        window.location.href = `account.html?id=${encodeURIComponent(viewer.id)}`;
        return;
    }
    window.location.href = "login-signin.html#login";
}

initAccountPage();
</script>
