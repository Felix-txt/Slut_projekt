<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CS Clicker</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    background: linear-gradient(135deg, #ececec, #d9d9d9);
}

.header {
    display: flex;
    align-items: center;
    padding: 15px;
    position: relative;
}

.burger svg {
    transition: 0.3s;
}
.burger:hover svg {
    transform: scale(1.1);
    filter: drop-shadow(0 0 6px #4a6cff);
}

.title {
    margin: auto;
    background: #ddd;
    padding: 10px 30px;
    border-radius: 20px;
    font-size: 32px;
    transition: 0.3s;
}
.title:hover {
    box-shadow: 0 0 8px #4a6cff;
}

.menu {
    display: none;
    flex-direction: column;
    background: #eee;
    position: absolute;
    top: 60px;
    left: 10px;
    padding: 15px;
    border-radius: 12px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    animation: fadeIn 0.2s ease;
    z-index: 1000;
}
.menu a {
    padding: 10px;
    text-decoration: none;
    color: #333;
    border-radius: 8px;
    transition: 0.2s;
}
.menu a:hover {
    background: #4a6cff;
    color: white;
    transform: translateX(5px);
}
.menu.show {
    display: flex;
}

.auth {
    display: flex;
    gap: 10px;
}

.login-btn {
    padding: 8px 16px;
    border-radius: 20px;
    border: none;
    background: #5a6c8f;
    color: white;
    cursor: pointer;
    transition: 0.3s;
}

.login-btn:hover {
    background: #6f85b5;
    transform: scale(1.03);
    box-shadow: 0 0 8px #4a6cff;
}

.signup-btn {
    padding: 8px 16px;
    border-radius: 20px;
    border: none;
    background: #2f4bb2;
    color: white;
    cursor: pointer;
    transition: 0.3s;
}

.signup-btn:hover {
    background: #3f5cff;
    transform: scale(1.03);
    box-shadow: 0 0 8px #4a6cff;
}

.container {
    display: flex;
    flex-direction: column;
    padding: 30px;
    gap: 30px;
}

.hero-section {
    width: 100%;
}

.slideshow {
    height: 340px;
    background: #888;
    border-radius: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    transition: 0.3s;
    font-size: 2rem;
    font-weight: bold;
}
.slideshow:hover {
    transform: scale(1.01);
    box-shadow: 0 0 12px #4a6cff;
}

.content-boxes {
    display: flex;
    gap: 30px;
    width: 100%;
}

.left {
    width: 300px;
    background: #dcdcdc;
    padding: 20px;
    border-radius: 20px;
    transition: 0.3s;
}
.left:hover {
    transform: translateY(-3px);
    box-shadow: 0 6px 15px rgba(0,0,0,0.15);
}

.left h1 {
    margin: 10px 0;
}

.main-download-btn {
    width: 100%;
    padding: 18px 20px;
    margin: 20px 0 15px 0;
    border: none;
    border-radius: 12px;
    background: linear-gradient(135deg, #1a3a52 0%, #2c5aa0 50%, #3b7dd6 100%);
    color: white;
    font-size: 1.1rem;
    font-weight: 700;
    letter-spacing: 0.8px;
    cursor: pointer;
    transition: all 0.3s ease;
    box-shadow: 0 8px 20px rgba(44, 90, 160, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.1);
    text-transform: uppercase;

    animation: gradientMove 6s ease infinite, pulse 2s infinite;

    transition: 0.3s;
}

.main-download-btn:hover {
    transform: translateY(-3px);
    box-shadow: 0 12px 28px rgba(44, 90, 160, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.15);
    background: linear-gradient(135deg, #0f1f33 0%, #1a3a52 50%, #2c5aa0 100%);
}

.main-download-btn:active {
    transform: translateY(-1px);
    box-shadow: 0 6px 16px rgba(44, 90, 160, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.05);
}

.left button {
    width: 100%;
    padding: 12px;
    margin: 10px 0;
    border: none;
    border-radius: 12px;
    background: #bbb;
    cursor: pointer;
    transition: 0.3s;
}
.left button:hover {
    background: #4a6cff;
    color: white;
    transform: scale(1.03);
    box-shadow: 0 0 8px #4a6cff;
}

.right {
    flex: 1;
    background: #dcdcdc;
    padding: 20px;
    border-radius: 20px;
    transition: 0.3s;
}
.right:hover {
    transform: translateY(-3px);
    box-shadow: 0 6px 15px rgba(0,0,0,0.15);
}

.slideshow {
    height: 220px;
    background: #888;
    border-radius: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    margin-bottom: 20px;
    transition: 0.3s;
}
.slideshow:hover {
    transform: scale(1.01);
    box-shadow: 0 0 12px #4a6cff;
}

.text-list p {
    text-align: center;
    margin: 10px 0;
    transition: 0.2s;
}
.text-list p:hover {
    color: #4a6cff;
    transform: scale(1.02);
}

.news-btn {
    width: 100%;
    padding: 12px;
    margin: 10px 0;
    border: none;
    border-radius: 12px;
    background: #bbb;
    color: #333;
    cursor: pointer;
    transition: 0.3s;
    font-size: 1rem;
    font-weight: 600;
}

.news-btn:hover {
    background: #4a6cff;
    color: white;
    transform: scale(1.03);
    box-shadow: 0 0 8px #4a6cff;
}

@keyframes fadeIn {
    from {opacity: 0; transform: translateY(-10px);}
    to {opacity: 1; transform: translateY(0);}
}

.user-icon {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: #5a6c8f;
    cursor: pointer;
    overflow: hidden;
    transition: 0.3s;
}
.user-icon:hover {
    box-shadow: 0 0 8px #4a6cff;
    transform: scale(1.05);
}
.user-icon img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.account-chip {
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 4px;
}

.account-name {
    max-width: 120px;
    color: #333;
    font-size: 0.82rem;
    font-weight: 700;
    text-align: center;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.logout-btn {
    border: none;
    background: #4a4747;
    color: white;
    padding: 5px 10px;
    border-radius: 12px;
    cursor: pointer;
    font-size: 12px;
}

@keyframes gradientMove {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}

@keyframes glowMove {
    0% { background-position: 0%; }
    100% { background-position: 200%; }
}

@keyframes shine {
    0% { left: -100%; }
    50% { left: 120%; }
    100% { left: 120%; }
}

@keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.05); }
}

</style>
</head>

<body>

<div class="header">

    <div class="burger" id="burger">
        <svg xmlns="http://www.w3.org/2000/svg" width="50" height="50" fill="currentColor" viewBox="0 0 15 15">
            <path fill-rule="evenodd" d="M2.5 12a.5.5 0 0 1 .5-.5h10a.5.5 0 0 1 0 1H3a.5.5 0 0 1-.5-.5m0-4a.5.5 0 0 1 .5-.5h10a.5.5 0 0 1 0 1H3a.5.5 0 0 1-.5-.5m0-4a.5.5 0 0 1 .5-.5h10a.5.5 0 0 1 0 1H3a.5.5 0 0 1-.5-.5"/>
        </svg>
    </div>

    <div class="title">CS-Clicker Game</div>

    <nav class="menu" id="menu">
        <a href="account.html">Account</a>
        <a href="game/patch-download.html">Patch & Download</a>
        <a href="game/gameinf.html">Game info</a>
        <a href="leaderboard.html">Leaderboard</a>
        <a href="../admin/panel.html" id="adminLink" style="display:none">Admin Panel</a>
    </nav>

    <div class="auth" id="authButtons">
        <button class="signup-btn" onclick="goSignup()">SIGN UP</button>
        <button class="login-btn" onclick="goLogin()">LOGIN</button>
    </div>
    <div class="account-chip" id="accountChip">
        <div class="user-icon" id="userIcon">
            <img id="profilePic" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23fff'%3E%3Cpath d='M12 12c2.7 0 5-2.3 5-5s-2.3-5-5-5-5 2.3-5 5 2.3 5 5 5zm0 2c-3.3 0-10 1.7-10 5v2h20v-2c0-3.3-6.7-5-10-5z'/%3E%3C/svg%3E" onclick="goAccount()">
            <input type="file" id="picUpload" accept="image/*" style="display:none" onchange="changeProfilePic(event)">
        </div>
        <div class="account-name" id="accountName"></div>
        <button class="logout-btn" onclick="logout()">Logout</button>
    </div>

</div>

<div class="container">

    <div class="hero-section">
        <div class="slideshow">PHOTO SLIDESHOW</div>
    </div>

    <div class="content-boxes">
        <div class="left">
            <h1>LuCS</h1>
            <h1>CASE CLICKER</h1>
            <button class="main-download-btn" onclick="downloadLatestClient()">⬇ DOWNLOAD NOW</button>

            <button class="Download-btn" onclick="goPatchdownload()">Patch Notes</button>
            <button>Leaderboard</button>
        </div>

        <div class="right">
            <div class="text-list">
                <button class="news-btn" onclick="goPatchdownload()">Latest Update</button>
                <p>Events</p>
                <button class="news-btn" onclick="goGameInfo()">Contact us</button>
            </div>
        </div>
    </div>

</div>

<script>

const API = getApiBase();

function getApiBase() {
    const host = window.location.hostname || "localhost";
    const protocol = window.location.protocol === "file:" ? "http:" : window.location.protocol;

    if (window.location.protocol !== "file:" && window.location.port === "8090") {
        return `${window.location.origin}/api`;
    }

    if (window.location.protocol !== "file:" && (window.location.port === "5000" || window.location.port === "5001")) {
        return `${window.location.origin}/api`;
    }

    return `${protocol}//${host}:5001/api`;
}

document.getElementById("burger").addEventListener("click", function() {
    document.getElementById("menu").classList.toggle("show");
});

document.addEventListener('click', function(event) {
    const menu = document.getElementById("menu")
    const burger = document.getElementById("burger")

    if (!menu.contains(event.target) && !burger.contains(event.target)){
        menu.classList.remove('show');
    }
});

function checkAuth(){ // kollar om användaren är logged in eller inte och om den är admin eller inte
    const token = localStorage.getItem("token");
    if (token){
        document.getElementById("authButtons").style.display = "none";
        document.getElementById("accountChip").style.display = "flex";
        document.getElementById("accountName").textContent = localStorage.getItem("username") || localStorage.getItem("email") || "Logged in";
        const savePic = localStorage.getItem("profilePicture");
        if (savePic) document.getElementById("profilePic").src = savePic;
        if (localStorage.getItem("isAdmin") === "true") {
            document.getElementById("adminLink").style.display = "block";
        }
    }
}

function clearSessionUser() {
    localStorage.removeItem("token");
    localStorage.removeItem("accountId");
    localStorage.removeItem("username");
    localStorage.removeItem("email");
    localStorage.removeItem("isAdmin");
    localStorage.removeItem("profilePicture");
}

function logout() {
    clearSessionUser();
    document.getElementById("authButtons").style.display = "flex";
    document.getElementById("accountChip").style.display = "none";
    const adminLink = document.getElementById("adminLink");
    if (adminLink) adminLink.style.display = "none";
    window.location.href = "login-signin.html#login";
}

function changeProfilePic(event){
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(e) {
        document.getElementById("profilePic").src = e.target.result;
        localStorage.setItem("profilePicture", e.target.result);
    }
    reader.readAsDataURL(file);
}

function goAccount() {
    const accountId = localStorage.getItem("accountId");
    window.location.href = accountId ? `account.html?id=${encodeURIComponent(accountId)}` : "account.html";
}

function goLogin() { // om man klickar på login går den till login sidan direkt
    window.location.href = "login-signin.html#login"; 
};

function goSignup() { // om man klickar på signup går den till signup siddan direkt
    window.location.href = "login-signin.html#signup";
};

function downloadLatestClient() {
    // TODO: Ersätt med faktisk filepath när den finns
    // Exempel: const filePath = "downloads/LuCS-Clicker-latest.exe";
    const filePath = "downloads/LuCS-Clicker-latest.exe";
    window.location.href = filePath;
};

function goPatchdownload() {
    window.location.href = "game/patch-download.html";
};

function goGameInfo() {
    window.location.href = "game/gameinf.html";
};

checkAuth();// kör auth status när sidan laddas
</script>

</body>
</html>
