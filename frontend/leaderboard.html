<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leaderboard</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    background: linear-gradient(135deg, #ececec, #d9d9d9);
}

.header {
    display: flex;
    align-items: center;
    padding: 15px;
}

.burger {
    cursor: pointer;
    user-select: none;
}

.burger svg {
    transition: 0.3s;
}
.burger:hover svg {
    transform: scale(1.1);
    filter: drop-shadow(0 0 6px #4a6cff);
}

.title {
    margin: auto;
    background: #ddd;
    padding: 10px 30px;
    border-radius: 20px;
    font-size: 32px;
}

.auth {
    display: flex;
    gap: 10px;
}

.auth button {
    padding: 8px 16px;
    border-radius: 20px;
    border: none;
    cursor: pointer;
    transition: 0.3s;
}

.login-btn { background: #5a6c8f; color: white; }
.signup-btn { background: #2f4bb2; color: white; }

.auth button:hover {
    transform: scale(1.05);
    box-shadow: 0 0 10px #4a6cff;
}

.menu {
    display: none;
    flex-direction: column;
    background: #eee;
    position: absolute;
    top: 60px;
    left: 10px;
    padding: 12px;
    border-radius: 10px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    animation: fadeIn 0.2s ease;
}
.menu a {
    padding: 10px;
    text-decoration: none;
    color: #333;
    border-radius: 8px;
    transition: 0.2s;
}
.menu a:hover {
    background: #4a6cff;
    color: white;
    transform: translateX(5px);
}
.menu.show {
    display: flex;
}

.container {
    display: flex;
    justify-content: center;
    padding: 40px;
}

.leaderboard {
    width: 700px;
    background: #dcdcdc;
    border-radius: 20px;
    padding: 20px;
    transition: 0.3s;
}

.leaderboard:hover {
    box-shadow: 0 10px 25px rgba(0,0,0,0.2);
}

.lb-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 15px;
    gap: 12px;
}

.lb-header h2 {
    font-weight: normal;
}

.sort-controls {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    justify-content: flex-end;
}

.sort-btn {
    border: none;
    border-radius: 10px;
    padding: 8px 10px;
    background: #bbb;
    color: #222;
    cursor: pointer;
    font-weight: 700;
    transition: 0.2s;
}

.sort-btn:hover,
.sort-btn.active {
    background: #4a6cff;
    color: white;
    box-shadow: 0 0 8px #4a6cff;
}

.lb-list {
    max-height: 300px;
    overflow-y: auto;
    padding-right: 10px;
}

.player {
    display: flex;
    align-items: center;
    background: #cfcfcf;
    padding: 10px;
    border-radius: 12px;
    margin: 10px 0;
    transition: 0.2s;
}

.player:hover {
    transform: scale(1.02);
    background: #bfbfbf;
}

.avatar {
    width: 50px;
    height: 50px;
    background: #5a6c8f;
    border-radius: 50%;
    margin-right: 15px;
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 800;
}

.info {
    flex: 1;
}

.name {
    font-weight: 800;
    color: #222;
}

.score {
    font-weight: 800;
    color: #2f4bb2;
    white-space: nowrap;
}

.player-top {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    align-items: center;
}

.stats {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    margin-top: 7px;
    color: #333;
    font-size: 0.9rem;
}

.empty-state {
    background: #cfcfcf;
    border-radius: 12px;
    padding: 18px;
    color: #333;
    text-align: center;
}

.lb-list::-webkit-scrollbar {
    width: 8px;
}
.lb-list::-webkit-scrollbar-thumb {
    background: #888;
    border-radius: 10px;
}
@keyframes fadeIn {
    from {opacity: 0; transform: translateY(-10px);}
    to {opacity: 1; transform: translateY(0);}
}

.user-icon {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: #5a6c8f;
    cursor: pointer;
    overflow: hidden;
    transition: 0.3s;
}
.user-icon:hover {
    box-shadow: 0 0 8px #4a6cff;
    transform: scale(1.05);
}
.user-icon img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.account-chip {
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 4px;
}

.account-name {
    max-width: 120px;
    color: #333;
    font-size: 0.82rem;
    font-weight: 700;
    text-align: center;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.logout-btn {
    border: none;
    background: #4a4747;
    color: white;
    padding: 5px 10px;
    border-radius: 12px;
    cursor: pointer;
    font-size: 12px;
}

</style>
</head>

<body>

<div class="header">

    <div class="burger" id="burger">
        <svg xmlns="http://www.w3.org/2000/svg" width="50" height="50" fill="currentColor" class="bi bi-list" viewBox="0 0 15 15">
            <path fill-rule="evenodd" d="M2.5 12a.5.5 0 0 1 .5-.5h10a.5.5 0 0 1 0 1H3a.5.5 0 0 1-.5-.5m0-4a.5.5 0 0 1 .5-.5h10a.5.5 0 0 1 0 1H3a.5.5 0 0 1-.5-.5m0-4a.5.5 0 0 1 .5-.5h10a.5.5 0 0 1 0 1H3a.5.5 0 0 1-.5-.5"/>
        </svg>
    </div>

    <div class="title">CS-Clicker Game</div>

    <div class="auth" id="authButtons">
        <button class="signup-btn" onclick="goSignup()">SIGN UP</button>
        <button class="login-btn" onclick="goLogin()">LOGIN</button>
    </div>
    <div class="account-chip" id="accountChip">
        <div class="user-icon" onclick="goAccount()"></div>
        <div class="account-name" id="accountName"></div>
        <button class="logout-btn" onclick="logout()">Logout</button>
    </div>

    <nav class="menu" id="menu">
        <a href="index.html">Home</a>
        <a href="account.html">Account</a>
        <a href="game/patch-download.html">Patch & Download</a>
        <a href="game/gameinf.html">Game info</a>
    </nav>

</div>

<div class="container">
    <div class="leaderboard">

        <div class="lb-header">
            <h2>Leaderboard</h2>
            <div class="sort-controls">
                <button class="sort-btn active" data-sort="money">Money</button>
                <button class="sort-btn" data-sort="level">Level</button>
                <button class="sort-btn" data-sort="casesOpened">Cases</button>
                <button class="sort-btn" data-sort="inventoryCount">Items</button>
            </div>
        </div>

        <div class="lb-list" id="leaderboardList">
            <div class="empty-state">Loading leaderboard...</div>
        </div>

    </div>
</div>

<script>

const API = "http://100.126.153.254:5000/api";
let currentSort = "money";

async function apiFetch(path, options = {}) {
    const res = await fetch(`${API}${path}`, options);
    const text = await res.text();
    return text ? JSON.parse(text) : {};
}

    throw lastError || new Error("Could not connect to server");
}

document.getElementById("burger").addEventListener("click", function() {
    document.getElementById("menu").classList.toggle("show");
});

document.addEventListener('click', function(event) {
    const menu = document.getElementById("menu")
    const burger = document.getElementById("burger")

    if (!menu.contains(event.target) && !burger.contains(event.target)){
        menu.classList.remove('show');
    }
});

function checkAuth(){ // kollar om anvä'ndaren är logged in eller inte
    const token = localStorage.getItem("token");
    if (token){
        document.getElementById("authButtons").style.display = "none";
        document.getElementById("accountChip").style.display = "flex";
        document.getElementById("accountName").textContent = localStorage.getItem("username") || localStorage.getItem("email") || "Logged in";
    }
}

function clearSessionUser() {
    localStorage.removeItem("token");
    localStorage.removeItem("accountId");
    localStorage.removeItem("username");
    localStorage.removeItem("email");
    localStorage.removeItem("isAdmin");
}

function logout() {
    clearSessionUser();
    document.getElementById("authButtons").style.display = "flex";
    document.getElementById("accountChip").style.display = "none";
    window.location.href = "login-signin.html#login";
}

function goLogin() {
    window.location.href = "login-signin.html";
}

function goSignup() {
    window.location.href = "login-signin.html";
}

function escapeHtml(value) {
    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

function formatNumber(value) {
    return Number(value || 0).toLocaleString("sv-SE");
}

function getMainScore(row) {
    if (currentSort === "level") return `Lvl ${formatNumber(row.level)}`;
    if (currentSort === "casesOpened") return `${formatNumber(row.totalCasesOpened)} cases`;
    if (currentSort === "inventoryCount") return `${formatNumber(row.inventoryCount)} items`;
    return `$${formatNumber(row.money)}`;
}

function renderLeaderboard(rows) {
    const list = document.getElementById("leaderboardList");

    if (!rows.length) {
        list.innerHTML = `<div class="empty-state">No leaderboard saves yet.</div>`;
        return;
    }

    list.innerHTML = rows.map((row) => `
        <div class="player">
            <div class="avatar">#${escapeHtml(row.rank)}</div>
            <div class="info">
                <div class="player-top">
                    <div class="name">${escapeHtml(row.username)}</div>
                    <div class="score">${escapeHtml(getMainScore(row))}</div>
                </div>
                <div class="stats">
                    <span>Level ${formatNumber(row.level)}</span>
                    <span>$${formatNumber(row.money)}</span>
                    <span>${formatNumber(row.totalCasesOpened)} cases</span>
                    <span>${formatNumber(row.inventoryCount)} items</span>
                </div>
            </div>
        </div>
    `).join("");
}

async function loadLeaderboard(sort = currentSort) {
    currentSort = sort;
    const list = document.getElementById("leaderboardList");
    list.innerHTML = `<div class="empty-state">Loading leaderboard...</div>`;

    try {
        const data = await apiFetch(`/leaderboard?sort=${encodeURIComponent(currentSort)}&limit=50`);

        if (!data.ok) {
            list.innerHTML = `<div class="empty-state">${escapeHtml(data.errorMessage || "Could not load leaderboard.")}</div>`;
            return;
        }

        renderLeaderboard(data.rows || []);
    } catch (error) {
        list.innerHTML = `<div class="empty-state">Could not connect to server.</div>`;
    }
}

document.querySelectorAll(".sort-btn").forEach((button) => {
    button.addEventListener("click", () => {
        document.querySelectorAll(".sort-btn").forEach((item) => item.classList.remove("active"));
        button.classList.add("active");
        loadLeaderboard(button.dataset.sort);
    });
});

function goAccount() {
    const accountId = localStorage.getItem("accountId");
    window.location.href = accountId ? `account.html?id=${encodeURIComponent(accountId)}` : "account.html";
}

checkAuth();
loadLeaderboard();
</script>

</body>
</html>
