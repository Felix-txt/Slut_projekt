
<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Auth</title>

<style>
* {
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    background: linear-gradient(135deg, #f0f0f0, #dcdcdc);
    display: flex;
    flex-direction: column;
    align-items: center;
}

.header {
    margin: 20px;
    background: #ddd;
    padding: 10px 30px;
    border-radius: 15px;
    font-size: 32px;
}

.card {
    background: #cfcfcf;
    padding: 30px;
    border-radius: 25px;
    width: 320px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    transition: 0.3s;
}

.card:hover {
    transform: translateY(-5px) scale(1.02);
    box-shadow: 0 15px 40px rgba(0,0,0,0.3);
}

.toggle {
    display: flex;
    background: #6c7386;
    border-radius: 12px;
    overflow: hidden;
    margin-bottom: 20px;
}

.toggle button {
    flex: 1;
    padding: 10px;
    border: none;
    color: white;
    cursor: pointer;
    transition: 0.3s;
}

.toggle button.active {
    background: #2f4bb2;
}

.toggle button:hover {
    filter: brightness(1.2);
}

input {
    width: 100%;
    padding: 12px;
    margin: 10px 0;
    border-radius: 10px;
    border: none;
    outline: none;
    transition: 0.2s;
}

input:focus {
    box-shadow: 0 0 10px #4a6cff;
}

.submit {
    width: 100%;
    padding: 12px;
    border-radius: 12px;
    border: none;
    background: #2f4bb2;
    color: white;
    font-weight: bold;
    cursor: pointer;
    transition: 0.3s;
}

.submit:hover {
    background: #3f5cff;
    transform: scale(1.05);
    box-shadow: 0 0 15px #4a6cff;
}

.link {
    font-size: 12px;
    color: blue;
    margin: 5px 0;
    cursor: pointer;
}

.hidden {
    display: none;
}
</style>
</head>

<body>

<div class="header">CS-Clicker Game</div>

<div class="card">

    <div class="toggle">
        <button id="signupBtn" class="active" onclick="showSignup()">SIGN UP</button>
        <button id="loginBtn" onclick="showLogin()">LOGIN</button>
    </div>

    <div id="signupForm">
        <input type="email" placeholder="Email address">
        <input type="text" placeholder="Username">
        <input type="password" placeholder="Password">
        <button class="submit">SIGN UP</button>
    </div>

    <div id="loginForm" class="hidden">
        <input type="email" placeholder="Email address">
        <input type="password" placeholder="Password">
        <div class="link">Forgot password?</div>
        <button class="submit">LOGIN</button>
    </div>

</div>

<script>
function showSignup() {
    document.getElementById("signupForm").classList.remove("hidden");
    document.getElementById("loginForm").classList.add("hidden");

    signupBtn.classList.add("active");
    loginBtn.classList.remove("active");
}

function showLogin() {
    document.getElementById("loginForm").classList.remove("hidden");
    document.getElementById("signupForm").classList.add("hidden");

    loginBtn.classList.add("active");
    signupBtn.classList.remove("active");
}
</script>

</body>
</html>
