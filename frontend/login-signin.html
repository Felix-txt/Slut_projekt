
<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Auth</title>
    <link rel="stylesheet" href="login-signin.css">
</head>

<body>

<div class="header">CS-Clicker Game</div>

<div class="card">

    <div class="toggle">
        <button id="signupBtn" class="active" onclick="showSignup()">SIGN UP</button>
        <button id="loginBtn" onclick="showLogin()">LOGIN</button>
    </div>

    <div id="signupForm">
        <input type="email" placeholder="Email address">
        <input type="text" placeholder="Username">
        <input type="password" placeholder="Password">
        <button class="submit">SIGN UP</button>
    </div>

    <div id="loginForm" class="hidden">
        <input type="email" placeholder="Email address">
        <input type="password" placeholder="Password">
        <div class="link">Forgot password?</div>
        <button class="submit">LOGIN</button>
    </div>

</div>

<script>
function showSignup() {
    document.getElementById("signupForm").classList.remove("hidden");
    document.getElementById("loginForm").classList.add("hidden");

    signupBtn.classList.add("active");
    loginBtn.classList.remove("active");
}

function showLogin() {
    document.getElementById("loginForm").classList.remove("hidden");
    document.getElementById("signupForm").classList.add("hidden");

    loginBtn.classList.add("active");
    signupBtn.classList.remove("active");
}
</script>

</body>
</html>
