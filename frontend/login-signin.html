
<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Auth</title>
    <link rel="stylesheet" href="login-signin.css">
</head>

<body>

<div class="header">CS-Clicker Game</div>

<div class="card">

    <div class="toggle">
        <button id="signupBtn" onclick="showSignup()">SIGN UP</button>
        <button id="loginBtn" class="active" onclick="showLogin()">LOGIN</button>
    </div>

    <div id="signupForm" class="hidden">
        <input type="email" id="signupEmail" placeholder="Email address">
        <input type="text" id="signupUsername" placeholder="Username">
        <input type="password" id="signupPassword" placeholder="Password">
        <button class="submit" onclick="signup()">SIGN UP</button>
        <div id="signupMsg"></div>
    </div>

    <div id="loginForm">
        <input type="email" id="loginEmail" placeholder="Email address">
        <input type="password" id="loginPassword" placeholder="Password">
        <div id="adminCodeWrap" class="hidden">
            <input type="password" id="adminCode" placeholder="Extra verification code">
        </div>
        <label class="remember-me">
            <input type="checkbox" id="rememberMe">
            <span>Remember me</span>
        </label>
        <button type="button" class="link" onclick="showForgotPassword()">Forgot password?</button>
        <button class="submit" onclick="login()">LOGIN</button>
        <div id="loginMsg"></div>
    </div>

    <div id="forgotForm" class="hidden">
        <p class="form-copy">Enter your email and we will send a reset link.</p>
        <input type="email" id="forgotEmail" placeholder="Email address">
        <button class="submit" onclick="requestPasswordReset()">SEND RESET LINK</button>
        <button type="button" class="link" onclick="showLogin()">Back to login</button>
        <div id="forgotMsg"></div>
    </div>

    <div id="resetForm" class="hidden">
        <p class="form-copy">Choose a new password for your account.</p>
        <input type="password" id="resetPassword" placeholder="New password">
        <input type="password" id="resetPasswordConfirm" placeholder="Confirm new password">
        <button class="submit" onclick="resetPassword()">RESET PASSWORD</button>
        <button type="button" class="link" onclick="showLogin()">Back to login</button>
        <div id="resetMsg"></div>
    </div>

</div>

<script>
const API_CANDIDATES = getApiCandidates();

function getApiCandidates() {
    const host = window.location.hostname || "localhost";
    const protocol = window.location.protocol === "file:" ? "http:" : window.location.protocol;
    const candidates = [];

    if (window.location.protocol !== "file:" && window.location.port === "8085") {
        candidates.push(`${window.location.origin}/api`);
    }

    if (window.location.protocol !== "file:" && (window.location.port === "5000" || window.location.port === "5001")) {
        candidates.push(`${window.location.origin}/api`);
    }

    candidates.push(`${protocol}//${host}:5001/api`);
    candidates.push(`${protocol}//${host}:5000/api`);

    return [...new Set(candidates)];
}

async function apiFetch(path, options = {}) {
    let lastError = null;

    for (const baseUrl of API_CANDIDATES) {
        try {
            const res = await fetch(`${baseUrl}${path}`, options);
            const text = await res.text();
            let data = {};

            try {
                data = text ? JSON.parse(text) : {};
            } catch (parseError) {
                data = {
                    ok: false,
                    errorType: "server",
                    errorMessage: res.ok ? "Invalid server response" : `Server returned ${res.status}`
                };
            }

            return data;
        } catch (error) {
            lastError = error;
        }
    }

    throw lastError || new Error("Could not connect to server");
}

function saveSession(data) {
    localStorage.setItem("token", data.token);
    localStorage.setItem("accountId", data.accountId || "");
    localStorage.setItem("username", data.username || "");
    localStorage.setItem("email", data.email || "");
    localStorage.setItem("isAdmin", data.is_admin ? "true" : "false");
}

function loadRememberedLogin() {
    const savedEmail = localStorage.getItem("rememberedEmail") || "";
    const rememberMe = document.getElementById("rememberMe");
    const loginEmail = document.getElementById("loginEmail");

    if (savedEmail) {
        loginEmail.value = savedEmail;
        rememberMe.checked = true;
    }
}

function saveRememberedLogin(email) {
    if (document.getElementById("rememberMe").checked) {
        localStorage.setItem("rememberedEmail", email);
    } else {
        localStorage.removeItem("rememberedEmail");
    }
}

function showSignup() {
    document.getElementById("signupForm").classList.remove("hidden");
    document.getElementById("loginForm").classList.add("hidden");
    document.getElementById("forgotForm").classList.add("hidden");
    document.getElementById("resetForm").classList.add("hidden");
    document.getElementById("signupBtn").classList.add("active");
    document.getElementById("loginBtn").classList.remove("active");
}

function showLogin() {
    document.getElementById("loginForm").classList.remove("hidden");
    document.getElementById("signupForm").classList.add("hidden");
    document.getElementById("forgotForm").classList.add("hidden");
    document.getElementById("resetForm").classList.add("hidden");
    document.getElementById("loginBtn").classList.add("active");
    document.getElementById("signupBtn").classList.remove("active");
}

function showForgotPassword() {
    const loginEmail = document.getElementById("loginEmail").value;
    document.getElementById("forgotEmail").value = loginEmail;
    document.getElementById("forgotMsg").textContent = "";
    document.getElementById("loginForm").classList.add("hidden");
    document.getElementById("signupForm").classList.add("hidden");
    document.getElementById("resetForm").classList.add("hidden");
    document.getElementById("forgotForm").classList.remove("hidden");
    document.getElementById("signupBtn").classList.remove("active");
    document.getElementById("loginBtn").classList.remove("active");
}

function showResetPassword() {
    document.getElementById("resetMsg").textContent = "";
    document.getElementById("loginForm").classList.add("hidden");
    document.getElementById("signupForm").classList.add("hidden");
    document.getElementById("forgotForm").classList.add("hidden");
    document.getElementById("resetForm").classList.remove("hidden");
    document.getElementById("signupBtn").classList.remove("active");
    document.getElementById("loginBtn").classList.remove("active");
}

async function signup() {
    const email = document.getElementById("signupEmail").value;
    const username = document.getElementById("signupUsername").value;
    const password = document.getElementById("signupPassword").value;
    const msg = document.getElementById("signupMsg");
    msg.textContent = "";

    try {
        const data = await apiFetch("/auth/register", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({email, username, password})
        });

        if (!data.ok) {
            msg.textContent = data.errorMessage || "Could not create account";
            return;
        }

        const loginData = await apiFetch("/auth/login", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({email, password})
        });

        if (loginData.token) {
            saveSession(loginData);
            window.location.href = `account.html?id=${encodeURIComponent(loginData.accountId)}`;
        } else {
            msg.textContent = loginData.errorMessage || "Account created, but login failed";
        }
    } catch (error) {
        msg.textContent = "Could not connect to server";
    }
}

async function login() {
    const email = document.getElementById("loginEmail").value;
    const password = document.getElementById("loginPassword").value;
    const adminCode = document.getElementById("adminCode").value;
    const adminCodeWrap = document.getElementById("adminCodeWrap");
    const msg = document.getElementById("loginMsg");
    msg.textContent = "";

    try {
        const data = await apiFetch("/auth/login", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({email, password, adminCode})
        });

        if (data.token) {
            saveSession(data);
            saveRememberedLogin(email);
            window.location.href = `account.html?id=${encodeURIComponent(data.accountId)}`;
        } else if (data.requiresAdminCode) {
            adminCodeWrap.classList.remove("hidden");
            document.getElementById("adminCode").focus();
            msg.textContent = data.errorMessage || "Extra verification required.";
        } else {
            msg.textContent = data.errorMessage || "Login failed";
        }
    } catch (error) {
        msg.textContent = "Could not connect to server";
    }
}

async function requestPasswordReset() {
    const email = document.getElementById("forgotEmail").value;
    const msg = document.getElementById("forgotMsg");
    msg.textContent = "";

    try {
        const data = await apiFetch("/auth/forgot-password", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({email})
        });

        if (!data.ok) {
            msg.textContent = data.errorMessage || "Could not create reset link";
            return;
        }

        msg.textContent = data.message || "If the email exists, a reset link has been created.";
    } catch (error) {
        msg.textContent = "Could not connect to server";
    }
}

async function resetPassword() {
    const token = getResetTokenFromHash();
    const password = document.getElementById("resetPassword").value;
    const passwordConfirm = document.getElementById("resetPasswordConfirm").value;
    const msg = document.getElementById("resetMsg");
    msg.textContent = "";

    if (!token) {
        msg.textContent = "Reset link is missing or invalid.";
        return;
    }

    if (password !== passwordConfirm) {
        msg.textContent = "Passwords do not match.";
        return;
    }

    try {
        const data = await apiFetch("/auth/reset-password", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({token, password})
        });

        if (!data.ok) {
            msg.textContent = data.errorMessage || "Could not reset password";
            return;
        }

        msg.textContent = data.message || "Password updated. You can now log in.";
        window.location.hash = "login";
        setTimeout(showLogin, 1200);
    } catch (error) {
        msg.textContent = "Could not connect to server";
    }
}

function getResetTokenFromHash() {
    const hash = window.location.hash || "";
    if (!hash.startsWith("#reset=")) return "";
    return decodeURIComponent(hash.replace("#reset=", ""));
}

function checkHash() {
    const hash = window.location.hash;
    if (hash.startsWith('#reset=')) showResetPassword();
    else if (hash === '#signup') showSignup();
    else if (hash === '#forgot') showForgotPassword();
    else showLogin();
}

document.addEventListener('DOMContentLoaded', function() {
    loadRememberedLogin();
    checkHash();
});
window.addEventListener('hashchange', checkHash);
</script>

</body>
</html>
