server {
    listen 80;
    client_max_body_size 350m;
    
    # Serve frontend files directly
    location / {
        root /usr/share/nginx/html/frontend/html;
        try_files $uri $uri/ /index.html;
    }
    
    # Serve admin files
    location /admin/ {
        alias /usr/share/nginx/html/admin/;
        try_files $uri $uri/ =404;
    }
    
    # Serve static assets (css, js, etc.) for frontend
    location /css/ {
        alias /usr/share/nginx/html/frontend/css/;
    }
    
    location /js/ {
        alias /usr/share/nginx/html/frontend/js/;
    }
    
    location /assets/ {
        alias /usr/share/nginx/html/frontend/assets/;
    }

    location /downloads/ {
        alias /usr/share/nginx/html/frontend/downloads/;
    }
    
    location /Photos/ {
        alias /usr/share/nginx/html/frontend/Photos/;
    }
    
    # Serve static assets for admin
    location /admin/css/ {
        alias /usr/share/nginx/html/admin/css/;
    }
    
    location /admin/js/ {
        alias /usr/share/nginx/html/admin/js/;
    }
    
    # API proxy
    location /api/ {
        proxy_pass http://api:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
