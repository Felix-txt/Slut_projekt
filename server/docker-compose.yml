services:
  postgres:
    image: postgres:15-alpine
    container_name: csgo-clicker-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-gameuser}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-your_secure_password}
      POSTGRES_DB: ${DB_NAME:-game_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-gameuser} -d ${DB_NAME:-game_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: csgo-clicker-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_USER: ${DB_USER:-gameuser}
      DB_PASSWORD: ${DB_PASSWORD:-your_secure_password}
      DB_NAME: ${DB_NAME:-game_db}
      DB_PORT: 5432
      PORT: 5000
      JWT_SECRET: ${JWT_SECRET:-your_jwt_secret_key}
    ports:
      - "5000:5000"
    volumes:
      - ./ssl:/app/ssl:ro

volumes:
  postgres_data: